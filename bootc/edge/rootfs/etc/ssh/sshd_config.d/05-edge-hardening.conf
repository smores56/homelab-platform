# The edge's sshd policy, carried from provision/edge/05-edge-hardening.conf with
# the reasons the image can state and the provisioned box could not. Keys only:
# the operator's key arrives through Ignition (the base's
# 90-afterburn-/91-ignition-authorized-keys-file.conf drop-ins are what point
# AuthorizedKeysFile at it), and root logs in by key or not at all.
#
# No ListenAddress, exactly as on smortress: sshd listens on every local address
# and firewalld decides who reaches it. The default zone is drop, only tailscale0
# is in the `tailscale` zone, and 22 is not in the emptied public zone
# (/usr/share/smoresnet/firewalld/zones). The public NIC's address is per
# instance and would have to be re-derived on every rebuild, so the interface --
# not a listener -- is the gate.
#
# The file sorts at 05- for the reason the lockout on smortress is written down
# (bootc/server/rootfs/etc/ssh/sshd_config.d/05-tailnet-ssh.conf): sshd parses its
# configuration twice, the second pass re-reads only matching Match blocks with
# first-obtained-value semantics, and the base ships
# 90-enable-localhost-passwords.conf, which sets PasswordAuthentication yes for
# loopback so Cockpit's web login can use a password. A drop-in sorting after 90-
# is silently ignored.
#
# The provider's /etc/ssh/sshd_config.d/99-ctrl.conf on the Ubuntu template this
# replaces sets PermitRootLogin yes and PasswordAuthentication yes. Nothing in the
# image may carry a password-auth drop-in, and because sshd keeps the first value
# it obtains, 05- wins over 99- if one ever reappears; the build asserts it.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no

# Loopback is still an arrival path: a local `ssh 127.0.0.1` and any future
# loopback tool reach this listener. Repeating the criterion with `no` is what
# stops the base's 90- file from re-enabling password auth on it.
Match Address 127.0.0.1,::1
  PasswordAuthentication no
