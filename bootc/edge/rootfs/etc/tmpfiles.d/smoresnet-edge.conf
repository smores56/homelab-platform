# State the edge's units need at boot, rather than at first bootstrap.
#
# A path a unit names in ReadWritePaths has to exist before the unit starts, not
# after: systemd sets the unit's mount namespace up first, and a missing target
# fails the unit with `Failed to set up mount namespacing:
# /var/lib/smoresnet: No such file or directory` and status=226/NAMESPACE. That
# is invisible until a boot does it -- nobody watches the boot after an install.
# The live edge lost `edge-boot-gate.service` exactly that way on the boot after
# its fresh install: the gate writes /var/lib/smoresnet, and the unit that made
# the directory does it three lines into its own ExecStart, which runs later.
# So every directory the units write is made here, at boot, before any of them.
#
# Caddy runs as User=caddy and keeps its ACME account key and certificates under
# /var/lib/caddy, and nothing else makes that directory: without this line the
# service starts, then fails every order with `mkdir /var/lib/caddy: permission
# denied` and answers 500 on all three names -- another of the four defects a
# from-scratch install found on the console.
#
# The deploy tree has its own fragment, /usr/lib/tmpfiles.d/smoresnet-deploy.conf,
# under /usr because it grows as the deploy plane does and has to ride bootc's
# updates. These three lines go to /etc instead because their owners are the one
# thing an operator may have to change on the box -- restoring Caddy's data
# directory from the recovery kit can hand it back under a different account --
# and /etc is the layer bootc does not overwrite.
#
# 0700 for /var/lib/smoresnet, and root:root, because the tailnet node identity
# lives there: smoresnet-tailscale-up.service's own `install -d -m 0700` now only
# re-asserts this mode, and smoresnet-firewall-tailscale.service and
# smoresnet-deploy-forward.service condition on the marker inside it.
#
# The 0750 caddy:caddy is the package's own account, which the base image's
# sysusers entry creates; a user that is somehow absent makes tmpfiles drop the
# line instead of failing the boot.
d /var/lib/smoresnet 0700 root root -
d /var/lib/caddy 0750 caddy caddy -
