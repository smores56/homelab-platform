[Timer]
# The vendor unit fires at boot+1h and then every 8h with up to 2h of jitter,
# which is a host that can reboot itself two or three times a day at no
# predictable time. Both list options are cleared rather than overridden: an
# `OnCalendar=` beside them would add a fourth window, not replace them.
OnBootSec=
OnUnitInactiveSec=
RandomizedDelaySec=0
# 04:00 America/New_York, one hour after smortress's app updates (03:00) and one
# before its base image (05:00): the three windows are staggered so a bad change
# has exactly one failure domain and a journal that says which change it was. A
# timezone-carrying calendar follows DST, so the window stays 04:00 local.
OnCalendar=*-*-* 04:00:00 America/New_York
# A missed window waits for tomorrow. With Persistent=true, a power cut that
# ended at 05:30 would fire every missed window at once on boot -- the
# simultaneous upgrade the stagger exists to prevent.
Persistent=false
