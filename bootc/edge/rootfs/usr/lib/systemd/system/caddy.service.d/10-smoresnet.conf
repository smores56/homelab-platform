# Caddy's configuration is the image's, in /usr/share/smoresnet/Caddyfile, and
# this drop-in is what points the packaged unit at it. It sorts after
# caddy.service because drop-ins in /usr/lib apply to a unit in the same
# directory, and it exists rather than a whole replacement unit because the
# package's own Type=notify, User=caddy and AmbientCapabilities are what make a
# non-root Caddy able to bind 443.
#
# Every Exec line is reset and restated: the packaged ones name /etc/caddy/Caddyfile,
# which the build deletes, so leaving them would be a unit that validates one file
# and runs another.
[Unit]
# The three values the Caddyfile substitutes are the operator's, in
# /etc/caddy/edge.env: the ACME address and the two Service upstream names, which
# are derived from the tailnet domain and so cannot ship in an image. Without the
# file Caddy cannot parse its config and would crash-loop from the install until
# edge-bootstrap ran, so the unit is skipped instead -- an absent operator file is
# a step not taken yet, not a broken image.
ConditionPathExists=/etc/caddy/edge.env
# The upstreams are MagicDNS names on the tailnet and the certificates are Let's
# Encrypt's, so both the tailnet and DNS have to be up. Wants= rather than
# Requires=: the recovery name proxies to loopback and still serves when the
# tailnet is down, and a tailnet outage must not take it down too.
Wants=network-online.target tailscaled.service
After=network-online.target tailscaled.service

[Service]
EnvironmentFile=/etc/caddy/edge.env
ExecStartPre=
ExecStartPre=/usr/bin/caddy validate --config /usr/share/smoresnet/Caddyfile --adapter caddyfile
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /usr/share/smoresnet/Caddyfile
# Cleared, not repointed: the Caddyfile sets `admin off`, so there is no API for
# `caddy reload` to reach and a successful-looking reload would be a lie. A
# config change arrives with the image and is a restart.
ExecReload=
# Serving three public names is the box's whole purpose; a crash that stays down
# until a human notices is the worst failure it has.
Restart=on-failure
RestartSec=10s
