# The edge's plaintext deploy secrets live here (design #939 section 4): the
# listener's webhook secret, the dead-man ping URL and the tailnet auth key. The
# directory is 0700 so the operator's 0600 files are not readable by anyone else
# even before the listener's own mode check refuses one that is. Created at boot
# from /usr, which bootc updates, rather than shipped in /etc, which it does not.
d /etc/smoresnet 0700 root root -
# The deploy plane's state tree. deploy_state_init creates it too, but the
# listener answers 503 until the queue exists and the drain units' ReadWritePaths
# need the path before they start, so boot is where it is made: a ReadWritePaths
# target that is absent fails its unit with 226/NAMESPACE in namespace setup,
# before the unit's own program runs. The server's /etc/tmpfiles.d/smortress.conf
# owns the same three lines for the same reason.
d /var/lib/homelab/deploy 0700 root root -
d /var/lib/homelab/deploy/queue 0700 root root -
d /var/lib/homelab/deploy/work 0700 root root -
