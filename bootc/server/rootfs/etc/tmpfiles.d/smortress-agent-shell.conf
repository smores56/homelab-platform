# Rootless Podman storage for the two shell runners (SDLC #715). The account is
# the owner because systemd-sysusers allocates its id; a numeric owner here
# would point at nobody after the account moved. 0700 keeps one runner's image
# store and container metadata out of the other's reach. Each runner's runtime
# directory is logind's /run/user/<uid>, created by the linger provisioning turns
# on -- not a path under /run/smortress, which rootless Podman rejects. The
# /run/smortress-agent-job below holds one directory per running job: the
# script the unit executes and the output file it writes. It is deliberately not
# under /run/smortress, whose 0700 root keeps the bridge socket out of reach --
# a unit running as a runner uid could not traverse that, and systemd fails the
# exec. 0711 lets a runner reach its own job directory without listing the tree.
d /var/lib/agent-shell 0755 root root -
d /var/lib/agent-shell/personal 0700 agent-shell-personal agent-shell-personal -
d /var/lib/agent-shell/general 0700 agent-shell-general agent-shell-general -
d /run/smortress-agent-job 0711 root root -
# The shell bridges' socket directories (SDLC #859, #860), one per trust class.
# 0710 lets the facade container's gid 1000 traverse to its class's socket; the
# socket itself is 0660 root:1000. The parent /run/smortress is root 0700, so no
# host uid reaches either path -- only the one container that mounts that
# directory. One directory per class is what keeps a mount from exposing both
# sockets: the facades share uid 1000, so the file mode cannot tell them apart,
# but neither container can dial a socket in a directory it does not mount.
# tmpfiles owns them rather than the bridge's RuntimeDirectory so a service
# restart keeps the inode the container already has mounted.
d /run/smortress/agent-shell-general 0710 root 1000 -
d /run/smortress/agent-shell-personal 0710 root 1000 -
