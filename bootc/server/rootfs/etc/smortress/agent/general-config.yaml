# General deployment (agent-general). The image ships this file;
# smortress-agent-config.service copies it to /var/lib/agent/general/config.yaml on
# the first boot only. From then on the runtime and the operator own that copy.
#
# No api_key, and that is the point of the deployment: the provider credential is
# held by agent-proxy (apps/agent_proxy/README.md), which adds the Authorization
# header on the way out. This gateway reaches the proxy by container name on
# agent-general.network and never sees the key.
#
# context_length is the hosted model's window, so the runtime does not have to
# discover it per request. It must match the model named here: the runtime pins
# the window, so a stale pin silently truncates a larger model's context.
# DeepSeek V4.1 Flash advertises 1,048,560 on neuralwatt; the previous pin was
# Qwen 3.8 27B's 262,128.
model:
  provider: custom
  base_url: http://smortress-agent-proxy:18003/v1
  default: deepseek-v4.1-flash
  context_length: 1048560

# Nothing in this deployment approves its own tool use: an approval is presented
# in the chat and decided outside the runtime.
approvals:
  mode: manual

# The toolsets stay at the runtime's defaults here on purpose. This is the
# internet-connected side, it mounts no personal source, and it holds no
# credential worth reaching: the closure in the personal config is about
# authority, not about a network that is already sealed.

# Subagents are on by default here and stay on, but the runtime's default cap is
# ten concurrent children against a hosted, metered provider. Three is the cap this
# deployment is willing to pay for; depth stays flat.
delegation:
  max_concurrent_children: 3
  max_spawn_depth: 1
  child_timeout_seconds: 1800
  inherit_mcp_toolsets: true

# The general deployment's source facade
# (units/quadlet/agent-facade-general.container), reached by container name on
# agent-general.network; it publishes nothing. Same shape as the personal one with
# its own token and its own source table, so `repos` and `books` exist here and
# nowhere else. The placeholder is substituted at seed time from
# agent-facade-general-token.yaml, and no template carries a token.
mcp_servers:
  general:
    url: http://smortress-agent-facade-general:18005/mcp
    headers:
      X-Deployment-Token: __FACADE_TOKEN__
    trust: full
