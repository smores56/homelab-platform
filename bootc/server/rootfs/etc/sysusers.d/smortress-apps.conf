# The apps tenant runs as one unprivileged, login-less user (SDLC #726, T7 of
# #701). Nothing names its id: systemd-sysusers allocates one here, and every
# consumer names the account instead — the nftables ruleset, the tmpfiles
# entries, the rendered Quadlets, and /srv/apps, whose owner init-zpool resolves
# when it chowns (smortress-zpool.service is ordered after sysusers, so the
# account exists by then). Demanding a fixed id was the bug: sysusers allocates
# the next free uid silently when the demand cannot be met, and every numeric
# reference then points at nobody — a dataset owner at another account, a
# user@<uid> drop-in attached to no user manager.
g apps -
u apps - "apps tenant" /var/home/apps /usr/sbin/nologin
