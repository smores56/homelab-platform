# No identity in this tree holds a Role or RoleBinding: no pod has an API
# client, so every account exists only to keep its pod off the `default` account
# and to make "no binding" a reviewable fact. Every pod runs with
# automountServiceAccountToken false.
#
# Restore execution is an operator/host action, not a cluster capability: host
# systemd units own ZFS, Restic and the repositories.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-service
  namespace: data-plane
  labels:
    app.kubernetes.io/name: event-service
    app.kubernetes.io/part-of: homelab
    homelab.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: write-broker
  namespace: data-plane
  labels:
    app.kubernetes.io/name: write-broker
    app.kubernetes.io/part-of: homelab
    homelab.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: confirmation-surface
  namespace: data-plane
  labels:
    app.kubernetes.io/name: confirmation-surface
    app.kubernetes.io/part-of: homelab
    homelab.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-relay
  namespace: data-plane
  labels:
    app.kubernetes.io/name: collector-relay
    app.kubernetes.io/part-of: homelab
    homelab.dev/tier: platform
automountServiceAccountToken: false
