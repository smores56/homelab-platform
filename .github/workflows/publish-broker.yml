# Builds and pushes the broker image; the steps are the shared contract in
# `_publish-image-unsigned.yml`.
name: publish-broker

on:
  push:
    branches: [main]
    paths:
      - "apps/broker/**"
      - ".github/workflows/publish-broker.yml"
      - ".github/workflows/_publish-image-unsigned.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-broker
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image-unsigned.yml
    with:
      name: broker
      dockerfile: apps/broker/Dockerfile
      context: apps/broker
