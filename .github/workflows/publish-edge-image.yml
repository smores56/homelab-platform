# Builds, pushes, signs and verifies the public edge bootc image (design #939, T3).
#
# The doctrine and the signing contract are publish-server-image.yml's: the base
# is a moving uCore stream tag resolved to a digest per run, that digest is what
# the image's org.opencontainers.image.base.digest label records, and the pushed
# digest is signed and verified with the repository's single cosign key from the
# `server-image` Environment.
#
# _publish-image.yml is not the vehicle: it takes no build arguments, so
# BASE_DIGEST could not reach the Containerfile, and its summary is an apps pin
# row in scripts/app-images.sh that a bootc artifact does not have. What this job
# shares with it is the contract, not the file: the Environment, the pinned
# cosign, the key match, the `.sig` lookaside assertion and the anonymous
# policy-checked pull.
#
# Push and workflow_dispatch only, so a pull_request run never sees this file.
# The edge does not deploy on push (design #939 section 5): the notify job at the
# bottom runs on a main dispatch alone, and the daily poll is the backstop for a
# release nobody dispatched.
name: publish-edge-image

on:
  push:
    branches: [main]
    # Every path the edge Containerfile reads, and nothing else. The tree it
    # copies is bootc/edge/rootfs, so the rootfs and every unit in it arrive
    # under the first entry; the rest is the pins file the build sources, the one
    # signing key the image is verified against (the repository has a single
    # key, shared with the server) and the build script itself.
    #
    # The set is asserted, not trusted: tests/image/server-image.bats derives the
    # COPY sources from the Containerfile and fails when one of them is not
    # covered by a filter here. That is the failure this listing has to prevent --
    # a tree the Containerfile copies and this filter does not name keeps
    # publishing the last build that happened to touch something else, so the
    # image is silently stale instead of absent.
    paths:
      - "bootc/edge/**"
      - "bootc/lib/**"
      # The boot gate sources the deploy state library and the output helpers the
      # Containerfile copies in (design #939, T7), so a change to either is a
      # change to what this image runs.
      - "scripts/deploy-state.sh"
      - "scripts/lib/**"
      # The dead-man beat is the server's program under the edge's own limits
      # (design #939, T8), so a change to it changes what this image runs.
      - "scripts/deploy-heartbeat.sh"
      # The poll backstop ships as /usr/libexec/deploy-poll (design #939, T11), so
      # a change to it has to reach the image the timer runs it from.
      - "scripts/deploy-poll.sh"
      # The repository has one signing key and the edge is verified against its
      # public half, so a change there re-publishes the edge as well.
      - "bootc/server/cosign.pub"
      - "scripts/build-image.sh"
      - ".github/workflows/publish-edge-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-edge-image
  cancel-in-progress: false

jobs:
  publish:
    name: build, push, sign, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: server-image
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo
      - name: install pinned cosign
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: the environment key matches the committed public key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -s bootc/server/cosign.pub
          cosign public-key --key env://COSIGN_PRIVATE_KEY >"$RUNNER_TEMP/cosign.pub"
          diff -u bootc/server/cosign.pub "$RUNNER_TEMP/cosign.pub"
      - name: permit the base pull for the builder
        # The runtime policy is the one that matters and arrives with T4's rootfs.
        # The builder has no uCore public key and the base is a uCore stream tag,
        # so this bypass is limited to the build container.
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '%s' '{"default":[{"type":"insecureAcceptAnything"}]}' \
            >"$HOME/.config/containers/policy.json"
      - name: resolve the base digest
        # The base tracks the uCore `stable` stream tag, so the digest is whatever
        # the tag names when the build starts. Resolve it here rather than inside
        # the build: a registry failure fails the job before anything is built, and
        # the run summary and the image label both name the digest that build ran
        # on. The tag moves, so this digest is a record, not a pin.
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          base=$EDGE_IMAGE
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$base")
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::cannot resolve the base digest of $base: $digest"
            exit 1
          fi
          echo "BASE_DIGEST=$digest" >>"$GITHUB_ENV"
          {
            echo "### Base image"
            echo
            echo "- \`$base\` (stream tag)"
            echo "- \`${base}@${digest}\` (resolved by this run)"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          echo "base: ${base}@${digest}"
      - name: build the edge artifact
        run: scripts/build-image.sh edge
      - name: push, sign and verify the pushed digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          tag="sha-${GITHUB_SHA::12}"
          image="${EDGE_IMAGE_REPO}:${tag}"
          authfile="$RUNNER_TEMP/auth.json"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | podman login --authfile "$authfile" \
            ghcr.io -u "${{ github.actor }}" --password-stdin
          cp "$authfile" "$DOCKER_CONFIG/config.json"
          podman push --authfile "$authfile" --digestfile "$RUNNER_TEMP/digest" "$image"
          digest=$(cat "$RUNNER_TEMP/digest")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          # bootc/containers-image reads the legacy lookaside tag, not the OCI 1.1
          # referrer bundle cosign >=3 writes by default. Sign legacy, then prove
          # the `.sig` tag exists, because `cosign verify` alone reads the bundle
          # and would pass while the host rejects the image.
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$image@$digest"
          # The lookaside tag is <repo>:<sha256-hex>.sig, not repo:tag:<hex>.sig.
          skopeo inspect --raw "docker://${EDGE_IMAGE_REPO}:${digest/:/-}.sig" >/dev/null
          cosign verify --key bootc/server/cosign.pub "$image@$digest"
          # `latest` is the edge's update handle: `bootc switch` adopts it once
          # and `bootc upgrade` re-resolves it every night, so the host follows a
          # pointer that only ever names a signed digest. It moves only after the
          # digest is signed and verified, and only from main, so a dispatch from
          # a branch cannot point the host at a build that would not have
          # deployed. The guards are the server's verbatim: builds are serialised
          # in push order, so the newest push is the last to run, and the one way
          # to walk the tag backwards is a rerun of an older push, which must not
          # move it (publish-server-image.yml has the argument in full).
          moved_latest=false
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::notice::not moving :latest; this run is $GITHUB_REF, not main"
          elif [[ $GITHUB_RUN_ATTEMPT != 1 ]]; then
            echo "::notice::not moving :latest; attempt $GITHUB_RUN_ATTEMPT is a rerun"
          else
            # Copy the signed manifest by digest instead of re-pushing by tag:
            # --all copies the exact manifest, so the resulting digest cannot
            # drift from the one that was verified.
            skopeo copy --all --authfile "$authfile" \
              "docker://${EDGE_IMAGE_REPO}@${digest}" "docker://${EDGE_IMAGE_REPO}:latest"
            latest_digest=$(skopeo inspect --format '{{.Digest}}' \
              "docker://${EDGE_IMAGE_REPO}:latest")
            if [[ $latest_digest != "$digest" ]]; then
              echo "::error::latest resolves to $latest_digest, not $digest"
              exit 1
            fi
            moved_latest=true
          fi
          {
            echo "### Derived edge image"
            echo
            echo "- \`$image\`"
            echo "- \`${EDGE_IMAGE_REPO}@${digest}\`"
            if [[ $moved_latest == true ]]; then
              echo "- \`${EDGE_IMAGE_REPO}:latest\` (the host's update handle)"
            fi
            echo
            echo "The edge's first install takes this digest (T9 and T10); every upgrade after it follows \`:latest\`."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "pin: ${EDGE_IMAGE_REPO}@${digest}"

  # The event path in the edge's release discipline (design #939 section 5). This
  # job is deliberately poor, exactly as the server's is: no checkout, no package
  # token, no signing key. `needs:` makes it a statement about a build that
  # finished and never a gate on it, `permissions: {}` leaves it nothing to reach
  # in this repository, and `environment: deploy-notify` is a different
  # Environment from the signing one, so the deploy node shares no trust domain
  # with the key.
  notify:
    name: notify the edge's deploy receiver
    needs: publish
    # The edge deploys on a dispatch alone: it is the host with the least rollback
    # (no snapshot, no boot counting), so a merge that touches the image must not
    # reboot it. The ref guard stays as well, because a dispatch can name a branch
    # and only main is a release, and the Environment's branch policy is the second
    # lock rather than the first.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: deploy-notify
    permissions: {}
    steps:
      # The server's OAuth client and the same ephemeral `tag:deploy` node: the ACL
      # admits that tag to the edge's receiver on 8484 and to nothing else on the
      # box (tofu/tailscale.tf, design #939 T11). No `ping:` input, for the same
      # reason as on smortress: the ACL admits one port, so a reachability probe
      # that cannot answer is a second question with its own failure mode.
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:deploy
      - name: sign the body and notify the receiver
        env:
          # The edge's own secret and not boot.json's `webhook.secret`: this value
          # is the one on the public box, plaintext at /etc/smoresnet/webhook-secret.yaml
          # (design #939 section 4), so rotating either host's key leaves the other
          # alone and a popped edge does not hold the key that posts to smortress.
          # It is the receiver's second factor; the ACL rule is only the first.
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.EDGE_DEPLOY_WEBHOOK_SECRET }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/deploy-body.json"
          # One program builds the body and signs the file it just wrote: the key
          # is read from the environment, so it is in no argv and no log line, and
          # signing the file rather than a string is what makes "the bytes that
          # were signed" a thing curl can be handed.
          sig=$(python3 - "$body" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import sys
          import time

          now = int(time.time())
          payload = {
              "repo": os.environ["REPO_NAME"],
              "commit": os.environ["COMMIT_SHA"],
              "ts": now,
              "nonce": secrets.token_hex(16),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(json.dumps(payload, separators=(",", ":")) + "\n")
          with open(sys.argv[1], "rb") as handle:
              data = handle.read()
          key = os.environ["DEPLOY_WEBHOOK_SECRET"].encode()
          print(hmac.new(key, data, hashlib.sha256).hexdigest())
          PY
          )
          if [[ -z ${sig:-} ]]; then
            echo "::error::could not build the signed deploy body"
            exit 1
          fi
          # No timestamp header: the skew is read from the body's `ts`, which is
          # the value the HMAC covers. A header would be an unsigned second
          # answer to the same question, and the receiver has to pick one.
          #
          # --data-binary and not -d: `-d` strips newlines, so the bytes on the wire
          # would differ from the bytes that were signed and the receiver would
          # reject a body this job insists it sent.
          curl --fail-with-body --max-time 30 \
            -H "X-Deploy-Signature: sha256=$sig" \
            --data-binary @"$body" \
            http://smoresnet:8484/v1/deploy
