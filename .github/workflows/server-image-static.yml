# Static checks for both bootc images: the core server's and the public edge's.
# Runs on pull requests and holds no secret: the real build/sign job is
# publish-server-image.yml (publish-edge-image.yml for the edge).
#
# The edge's checker, bootc/edge/tests/check.sh, runs in the same `image`
# area: it is the same artifact class, the area already claims bootc/edge/*, and
# a separate workflow would run this one a second time on every bootc/edge/**
# pull request because both would trigger on that tree. The checker asserts this
# wiring itself (its "a pull_request workflow runs this checker" row), so a filter
# that stops covering the edge fails there rather than in a stale image.
name: server-image-static

on:
  pull_request:
    paths:
      - "bootc/**"
      - "ignition/**"
      - "units/**"
      - "secrets/**"
      - "scripts/**"
      - "images/agent-runtime/**"
      - "tests/fixtures/**"
      - "tests/image/**"
      - "docs/core/server-image.md"
      - ".github/workflows/server-image-static.yml"
  push:
    branches: [main]
    paths:
      - "bootc/**"
      - "ignition/**"
      - "units/**"
      - "secrets/**"
      - "scripts/**"
      - "images/agent-runtime/**"
      - "tests/fixtures/**"
      - "tests/image/**"
      - "docs/core/server-image.md"
      - ".github/workflows/server-image-static.yml"

permissions: read-all

concurrency:
  group: server-image-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks and butane render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: install pinned butane
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/butane" \
            "https://github.com/coreos/butane/releases/download/v${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu"
          echo "${BUTANE_SHA256}  $RUNNER_TEMP/bin/butane" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/butane"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: server-image group
        # The group runs the static checks, both Ignition renders, and the
        # boundary test. The suites live under tests/image/.
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'image' --jobs "$(nproc)"
