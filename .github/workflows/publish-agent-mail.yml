# Builds, signs and proves the mbsync image the mail collector runs.
#
# mbsync has no upstream static release, and the bootc image ships only release
# artifacts with a pinned SHA-256, so the binary cannot live there. It lives in
# this image, built and signed here and pinned by digest like every other
# application image.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs.
name: publish-agent-mail

on:
  push:
    branches: [main]
    paths:
      - "images/agent-mail/**"
      - ".github/workflows/publish-agent-mail.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-mail
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: agent-mail
      dockerfile: images/agent-mail/Containerfile
      pin_prefix: images/agent-mail/Containerfile
    secrets: inherit
