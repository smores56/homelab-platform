# Builds, signs and proves the web UI image.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs.
name: publish-agent-webui

on:
  push:
    branches: [main]
    paths:
      - "images/agent-webui/**"
      - ".github/workflows/publish-agent-webui.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-webui
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: agent-webui
      dockerfile: images/agent-webui/Containerfile
      pin_prefix: images/agent-webui/Containerfile
    secrets: inherit
