# Builds, signs and proves one application image. The caller supplies the name,
# the Containerfile and the pin directory; everything else is the same contract
# every image pipeline must satisfy.
#
# It lives here rather than beside the other shared host artifacts in `lib/`,
# where the design would put it: GitHub resolves `uses:` only for a reusable
# workflow inside this repository's `.github/workflows/`, so a copy under `lib/`
# could not be called at all.
#
# Nothing a caller supplies is ever interpolated into a `run:` block (design
# #1011). Each input arrives as the environment variable that step's `env:` names
# and is used quoted, so a value is data to the shell rather than text spliced
# into the script before bash parses it. The one value that becomes a registry
# path -- the name -- is validated by `scripts/check-publish-inputs.sh` in a job
# of its own, which the publishing job `needs:`: no runner that installs cosign,
# holds the signing key or logs in to the registry exists until the input is
# proven safe, so a name carrying a command substitution fails with nothing of
# the caller's anywhere near a shell.
#
# The concurrency group is here, not in the caller. Two publishes of the same
# image must not overlap, and a caller that forgot its group would silently allow
# exactly that. Keyed on the name, a matrix run and a dispatch serialise per image.
name: _publish-image

on:
  workflow_call:
    inputs:
      name:
        description: image name and pin name
        required: true
        type: string
      dockerfile:
        description: path to the Containerfile
        required: true
        type: string
      pin_prefix:
        description: path used in the pin row before the digest
        required: true
        type: string
      context:
        description: docker build context
        required: false
        default: "."
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: validate the inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read-only, and no `environment`: this job cannot reach the signing key, so
    # a rejected input never touches a runner that holds one.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: reject an input that is unsafe as a path, a tag or a shell word
        env:
          NAME: ${{ inputs.name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          PIN_PREFIX: ${{ inputs.pin_prefix }}
        run: scripts/check-publish-inputs.sh

  publish:
    name: build, sign, verify
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: server-image
    concurrency:
      group: publish-${{ inputs.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: install pinned cosign
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: the environment key matches the committed public key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -s lib/containers/cosign.pub
          cosign public-key --key env://COSIGN_PRIVATE_KEY >"$RUNNER_TEMP/cosign.pub"
          diff -u lib/containers/cosign.pub "$RUNNER_TEMP/cosign.pub"
      - name: build and push
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          NAME: ${{ inputs.name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          image="ghcr.io/smores56/homelab-platform/$NAME"
          tag="sha-${GITHUB_SHA::12}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f "$DOCKERFILE" \
            -t "$image:$tag" "$CONTEXT"
          docker push "$image:$tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag" | cut -d@ -f2)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest in RepoDigests"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: sign and verify
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          NAME: ${{ inputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="ghcr.io/smores56/homelab-platform/$NAME@$DIGEST"
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$ref"
          cosign verify --key lib/containers/cosign.pub "$ref"
      - name: prove a policy-checked, anonymous pull
        env:
          NAME: ${{ inputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # The entry under test is the host's own, with the key it names: the
          # bootc image and the Quadlets pull with no registry credential, so a
          # private or unsigned package 401s or is rejected on the first boot
          # after deploy.
          #
          # The rest of the committed policy is dropped because the runner's
          # skopeo predates the `keyPaths` key that the ublue entry uses
          # ("invalid policy ... Unknown key \"keyPaths\""), and no entry here
          # pulls anything but an application image.
          sudo install -D -m 0644 lib/containers/cosign.pub /etc/pki/containers/smortress.pub
          sudo install -D -m 0644 \
            lib/containers/registries.d/ghcr.io-smortress.yaml \
            /etc/containers/registries.d/ghcr.io-smortress.yaml
          # The policy is rendered from the two files in lib/containers, which
          # are the ones the image renders, so this step pulls against what a
          # host would read rather than against a copy of it.
          lib/containers/render-policy.sh smortress >"$RUNNER_TEMP/policy.json"
          jq '{"default": [{"type": "reject"}],
               "transports": {"docker": {"ghcr.io/smores56/homelab-platform":
                 .transports.docker["ghcr.io/smores56/homelab-platform"]}}}' \
            "$RUNNER_TEMP/policy.json" >"$RUNNER_TEMP/policy.one.json"
          printf '{}' >"$RUNNER_TEMP/empty-auth.json"
          skopeo copy --retry-times 2 --authfile "$RUNNER_TEMP/empty-auth.json" \
            --policy "$RUNNER_TEMP/policy.one.json" \
            "docker://ghcr.io/smores56/homelab-platform/$NAME@$DIGEST" \
            "dir:$RUNNER_TEMP/pull"
          rm -rf "$RUNNER_TEMP/pull"
          echo "policy-checked anonymous pull ok: $NAME"
      - name: summary
        env:
          NAME: ${{ inputs.name }}
          PIN_PREFIX: ${{ inputs.pin_prefix }}
          TAG: ${{ steps.build.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### $NAME image"
            echo
            echo "\`ghcr.io/smores56/homelab-platform/$NAME:$TAG\`"
            echo
            echo "\`ghcr.io/smores56/homelab-platform/$NAME@$DIGEST\`"
            echo
            echo "Pin it by adding this row to \`scripts/app-images.sh\`:"
            echo
            echo '```'
            echo "  '$NAME|built:$PIN_PREFIX|$DIGEST'"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "pin: $NAME|built:$PIN_PREFIX|$DIGEST"
