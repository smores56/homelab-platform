# Builds, signs and proves the Mirage image.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs. Mirage has no upstream image, so
# unlike the mirrored rows this one is a `built:` pin and its digest is whatever
# the last run printed.
name: publish-mirage

on:
  push:
    branches: [main]
    paths:
      - "images/mirage/**"
      - ".github/workflows/publish-mirage.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-mirage
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: mirage
      dockerfile: images/mirage/Containerfile
      pin_prefix: images/mirage/Containerfile
    secrets: inherit
