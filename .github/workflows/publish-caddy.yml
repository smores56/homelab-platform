# Builds, signs and proves the Caddy image that answers DNS-01 for the tailnet
# names.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs.
name: publish-caddy

on:
  push:
    branches: [main]
    paths:
      - "images/caddy/**"
      - ".github/workflows/publish-caddy.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-caddy
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: caddy
      dockerfile: images/caddy/Containerfile
      pin_prefix: images/caddy/Containerfile
    secrets: inherit
