# Builds, signs and proves the Tuta calendar image.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs.
name: publish-tuta-calendar

on:
  push:
    branches: [main]
    paths:
      - "apps/tuta_calendar/**"
      - "images/tuta-calendar/**"
      - ".github/workflows/publish-tuta-calendar.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-tuta-calendar
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: tuta-calendar
      dockerfile: images/tuta-calendar/Containerfile
      pin_prefix: images/tuta-calendar/Containerfile
    secrets: inherit
