name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

# A hung test must fail its job instead of holding the runner for the whole
# timeout; the slowest test in the tree is ~12s, the two former monoliths
# included.
env:
  BATS_TEST_TIMEOUT: "120"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per area: each runs the tests whose `# bats file_tags=` names it,
# through tests/tags.bats' drift check, so a suite cannot land in no job. Job
# setup is only what that area needs to start — a runtime, a pinned tool, or a
# package the tests shell out to.
jobs:
  core:
    name: core (gate scripts, Restic plane, Quadlets, Serve)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: core
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'core' --jobs "$(nproc)"

  deploy:
    name: deploy (receiver, state, gates, apps apply)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: deploy
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'deploy' --jobs "$(nproc)"

  apps:
    name: apps and data plane (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: apps
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'apps||python||data-plane||agent-shell-bridge' --jobs "$(nproc)"

  edge:
    name: edge, tailnet and egress contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Stubs only: the edge probes themselves need a public host and a tailnet
      # node, and verify-public-edge.yml / verify-tailnet-names.yml have them.
      - name: edge
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'edge||tailnet-names||agent-egress||brave' --jobs "$(nproc)"

  image:
    name: image, ignition, tofu and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22"
      - name: validate the tofu config
        # No backend and no secrets: validate only needs provider schemas.
        run: |
          tofu -chdir=tofu init -backend=false -input=false
          tofu -chdir=tofu validate
      - name: image
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'image||tofu||actionlint' --jobs "$(nproc)"

  lint:
    name: lint, docs and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned sops and age
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: lint
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'lint||docs||secrets' --jobs "$(nproc)"

  tenants:
    name: tenants (backrest, tuta-calendar, provision)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backrest/package-lock.json
      - name: install gpg for the tuta-calendar suite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gpg
      - name: tenants
        run: git ls-files -z 'tests/*.bats' 'tests/*/*.bats' | xargs -0 bats --filter-tags 'provision||backrest||tuta-calendar' --jobs "$(nproc)"

  fork-pr-secret-boundary:
    name: fork-pr-secret-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: fork PRs receive no secrets
        run: |
          echo "This job is triggered by pull_request from fork and branch PRs."
          echo "It holds no environment and no repository secret; a fork PR run"
          echo "reaches only a read-only GITHUB_TOKEN. docs/negative-tests.md"
          echo "records the runtime half as a manual step."
          test -z "${CLOUDFLARE_API_TOKEN:-}"
      - name: no pull_request workflow references a secret
        run: scripts/check-pr-secret-boundary.sh
