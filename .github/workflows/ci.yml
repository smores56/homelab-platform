name: ci

on:
  pull_request:
    # The default three events, spelled out: the pre-merge plan's own tests read
    # this list (tests/tofu/check.bats), and a label event would let a Write
    # collaborator re-run a refused plan by labelling their own PR.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

# No BATS_TEST_TIMEOUT: with --jobs, bats 1.14 leaves the watchdog's `sleep`
# child behind and the run stops making progress. The job's timeout-minutes is
# what bounds a hang here.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One required check: `PR gate`. Everything else here is one job per area, and
# the gate's verdict is the required check's.
#
# `changes` reads the diff once, through scripts/ci-areas.sh, and every area job
# gates itself on that answer with a job-level `if:` -- never a `paths:` filter.
# A path filter does not skip a required check, it leaves it Pending, so the pull
# request waits on a report that never comes; a job whose `if:` is false reports
# `skipped` instead, and the gate reads that as a pass. tests/tags.bats fails
# when a pull request workflow grows a `paths:` filter.
#
# `gate` then reads `needs` (scripts/ci-gate.py): skipped is a pass, failure and
# cancelled fail, and a job missing from `needs` fails -- so deleting an area job
# cannot quietly narrow the gate while the required check still turns green.
# tests/ci-gate.bats holds the decision offline and holds the gate's `needs` to
# `scripts/ci-areas.sh --jobs`.
#
# The plan is a job here too, through tofu-plan-pr.yml's `workflow_call`: it was
# a separately required check, which meant a docs-only pull request waited on a
# plan that had nothing to plan. It holds only the read-only credentials, from
# its own `cloudflare-plan` environment. The nine areas run their work directly,
# not through a `_check-<area>.yml` each: the gate needs them as sibling jobs
# either way, and a `workflow_call` file that only one caller ever uses moves the
# content out of the file a reader looks in without buying a second caller.
#
# Code that decides any of this is Kanbei-critical (docs/kanbei-critical.md):
# on a pull_request a same-repo branch runs the head's workflow file, so a diff
# that edits the workflows, scripts/ci-areas.sh or scripts/ci-gate.py fails the
# gate unless the actor is the owner.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `|| '[]'` so a failed selection is an empty list for the area jobs, not
      # an expression error: they skip, and the gate is the one that reports.
      areas: ${{ steps.select.outputs.areas || '[]' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The diff is against the base commit, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - name: select the areas this diff needs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=$BASE_SHA ;;
            push) base=$BEFORE ;;
            *) base='' ;;
          esac
          if [[ -z $base || $base =~ ^0+$ ]]; then
            # Nothing to compare against (a dispatch, a fresh branch): run every
            # area rather than guess which one this is.
            areas=$(scripts/ci-areas.sh --areas)
          else
            # --guard refuses a diff that edits the gate itself unless the actor
            # is the owner; it exits non-zero, this job fails, every area skips
            # and the gate reports that failure.
            areas=$(scripts/ci-areas.sh --changed --guard --base "$base")
          fi
          printf 'areas: %s\n' "$(printf '%s\n' "$areas" | paste -sd, -)"
          {
            echo "areas=$(printf '%s\n' "$areas" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          } >>"$GITHUB_OUTPUT"

  core:
    name: core (gate scripts, Restic plane, Quadlets, Serve)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'core')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: core
        run: |
          git ls-files -z 'tests/*.bats' 'tests/*/*.bats' |
            xargs -0 bats --filter-tags 'core' --jobs "$(nproc)" --no-parallelize-within-files

  deploy:
    name: deploy (state, gates, apps apply)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: deploy
        run: |
          git ls-files -z 'tests/*.bats' 'tests/*/*.bats' |
            xargs -0 bats --filter-tags 'deploy' --jobs "$(nproc)" --no-parallelize-within-files

  apps:
    name: apps and data plane (python)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'apps')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: apps
        run: |
          git ls-files -z 'tests/*.bats' 'tests/*/*.bats' |
            xargs -0 bats \
              --filter-tags apps \
              --filter-tags python \
              --filter-tags source-watch \
              --jobs "$(nproc)" --no-parallelize-within-files

  edge:
    name: edge, tailnet and egress contracts
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'edge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Stubs only: the fleet probe itself needs a public host and a tailnet node,
      # and verify-fleet.yml has them.
      - name: edge
        run: |
          git ls-files -z 'tests/*.bats' 'tests/*/*.bats' |
            xargs -0 bats \
              --filter-tags fleet \
              --filter-tags agent-egress \
              --filter-tags brave \
              --filter-tags finance \
              --filter-tags mail \
              --filter-tags calendar \
              --filter-tags stream \
              --jobs "$(nproc)" --no-parallelize-within-files

  image:
    name: image, ignition, tofu and workflows
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'image')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: install pinned butane
        # tests/image/ignition-boundary renders the Ignition configs, and a
        # render without butane is a failure, not a skip.
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/butane" \
            "https://github.com/coreos/butane/releases/download/v${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu"
          echo "${BUTANE_SHA256}  $RUNNER_TEMP/bin/butane" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/butane"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22"
      - name: validate the tofu config
        # No backend and no secrets: validate only needs provider schemas.
        run: |
          tofu -chdir=tofu init -backend=false -input=false
          tofu -chdir=tofu validate
      # actionlint is local-only: install-ci-tools.sh pins no binary for it.
      - name: image
        run: |
          git ls-files -z 'tests/*.bats' 'tests/*/*.bats' |
            xargs -0 bats \
              --filter-tags image \
              --filter-tags tofu \
              --jobs "$(nproc)" --no-parallelize-within-files

  lint:
    name: lint, docs and secrets
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'lint')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned sops and age
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: lint
        run: |
          git ls-files -z 'tests/*.bats' 'tests/*/*.bats' |
            xargs -0 bats \
              --filter-tags lint \
              --filter-tags docs \
              --filter-tags secrets \
              --jobs "$(nproc)" --no-parallelize-within-files

  tenants:
    name: tenants (backrest, tuta-calendar)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'tenants')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install the pinned test runner
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backrest/package-lock.json
      # The backrest suite shells out to npx and npm; the toolchain is the
      # job's to install, and a half-installed node_modules makes it skip.
      - name: install the backrest toolchain
        run: npm ci --prefix backrest
      - name: install gpg for the tuta-calendar suite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gpg
      - name: tenants
        run: |
          git ls-files -z 'tests/*.bats' 'tests/*/*.bats' |
            xargs -0 bats \
              --filter-tags backrest \
              --filter-tags tuta-calendar \
              --jobs "$(nproc)" --no-parallelize-within-files

  fork-pr-secret-boundary:
    name: fork-pr-secret-boundary
    needs: changes
    if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.areas), 'fork-pr-secret-boundary')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: fork PRs receive no secrets
        run: |
          echo "This job is triggered by pull_request from fork and branch PRs."
          echo "It holds no environment and no repository secret; a fork PR run"
          echo "reaches only a read-only GITHUB_TOKEN. The runtime half needs a"
          echo "second GitHub identity and is a manual step."
          test -z "${CLOUDFLARE_API_TOKEN:-}"
      - name: no pull_request workflow references a secret
        run: scripts/check-pr-secret-boundary.sh

  drift:
    name: drift (sops policy, shared lib)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'drift')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # smores56/dotfiles is public, so scripts/check-sops-drift.sh fetches the
      # pinned policy anonymously: this job reads no secret, and a pull_request
      # run needs nothing a fork does not already have. The lib comparison also
      # runs inside the image area's suite; here it is the job that names drift,
      # so a host tree that grows a second copy fails as a rule, not as a test.
      - name: drift
        run: |
          scripts/check-sops-drift.sh
          scripts/check-lib-drift.sh

  plan:
    name: tofu plan
    needs: changes
    if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.areas), 'plan')
    # The plan itself, unchanged: tofu-plan-pr.yml is a `workflow_call`
    # definition now. It holds only the read-only credentials, from its own
    # `cloudflare-plan` environment, and refuses a PR that changes CI, so the
    # branch file that runs here can reach no credential that writes.
    uses: ./.github/workflows/tofu-plan-pr.yml
    # The sticky plan comment needs to write; the workflow itself asks for the
    # same pair, and a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      pull-requests: write

  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The required check. always() so a failed dependency is still reported by
    # this job: a skipped required check leaves the pull request waiting.
    if: always()
    needs:
      - changes
      - core
      - deploy
      - apps
      - edge
      - image
      - lint
      - tenants
      - fork-pr-secret-boundary
      - drift
      - plan
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # The rule is a program, not an expression: tests/ci-gate.bats drives it
      # offline with skipped, failed, cancelled and missing-key fixtures.
      - name: decide
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # One argument per job: an empty list is an argparse error, which fails
          # the gate rather than passing a check that proved nothing.
          mapfile -t jobs < <(scripts/ci-areas.sh --jobs)
          scripts/ci-gate.py --expected "${jobs[@]}" --require-success changes <<<"$NEEDS"
