name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs a check-all group, so a command is defined once in
# scripts/check-all.sh. Job-level setup is only what the group needs to start:
# a runtime, a pinned tool, or a package the tests shell out to.
jobs:
  broker:
    name: broker unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: broker
        run: scripts/check-all.sh --only broker

  webhook:
    name: webhook unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: webhook
        run: scripts/check-all.sh --only webhook

  agent-proxy:
    name: agent-proxy unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: agent-proxy
        run: scripts/check-all.sh --only agent-proxy

  agent-facade:
    name: agent-facade unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: agent-facade
        run: scripts/check-all.sh --only agent-facade

  agent-shell-bridge:
    name: agent-shell-bridge unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: agent-shell-bridge
        run: scripts/check-all.sh --only agent-shell-bridge

  data-plane:
    name: data-plane unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: data-plane
        run: scripts/check-all.sh --only data-plane

  tuta-calendar:
    name: tuta-calendar unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # gpg is the seal's own runtime and is in the image; the driver builds the
      # pinned venv from images/tuta-calendar/requirements.lock itself.
      - name: install gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg
      - name: tuta-calendar
        run: scripts/check-all.sh --only tuta-calendar

  agent-egress:
    name: agent-egress unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: agent-egress
        run: scripts/check-all.sh --only agent-egress

  brave:
    name: brave seed and snapshot unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: brave
        run: scripts/check-all.sh --only brave

  tofu:
    name: tofu fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: validate
        # No backend and no secrets: validate only needs provider schemas.
        run: |
          tofu -chdir=tofu init -backend=false -input=false
          tofu -chdir=tofu validate
      - name: tofu-check and tofu-fmt
        run: scripts/check-all.sh --only tofu-check,tofu-fmt

  backrest:
    name: backrest reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backrest/package-lock.json
      - name: backrest
        run: scripts/check-all.sh --only backrest

  lint:
    name: lint (yaml, shell, pins, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: lint
        run: scripts/check-all.sh --only lint

  docs:
    name: documentation references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: references and anchors
        run: scripts/check-all.sh --only docs

  secrets:
    name: SOPS policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned sops and age
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: policy and index checks
        run: scripts/check-all.sh --only secrets

  gates:
    name: core, apps, deploy, provision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: gates
        run: scripts/check-all.sh --only provision,core,apps,deploy

  fork-pr-secret-boundary:
    name: fork-pr-secret-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: fork PRs receive no secrets
        run: |
          echo "This job is triggered by pull_request from fork and branch PRs."
          echo "It holds no environment and no repository secret; a fork PR run"
          echo "reaches only a read-only GITHUB_TOKEN. docs/negative-tests.md"
          echo "records the runtime half as a manual step."
          test -z "${CLOUDFLARE_API_TOKEN:-}"
      - name: no pull_request workflow references a secret
        run: scripts/check-pr-secret-boundary.sh

  check-all:
    name: check-all self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # The driver decides which groups a branch runs; a bad selector is a green
      # run that tested nothing, so its logic carries its own test.
      - name: run the pre-commit driver self-test
        run: tests/check-all/check.sh
