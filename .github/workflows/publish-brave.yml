# Builds, signs and proves the Brave seed image.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs.
name: publish-brave

on:
  push:
    branches: [main]
    paths:
      - "images/brave/**"
      - ".github/workflows/publish-brave.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-brave
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: brave
      dockerfile: images/brave/Containerfile
      pin_prefix: images/brave/Containerfile
    secrets: inherit
