# Builds, pushes, signs and verifies the smortress derived bootc image.
#
# The signing key is an environment secret; the public half is committed at
# lib/containers/cosign.pub and baked into the image and its Ignition policy. This
# workflow is push/workflow_dispatch only: a pull_request run never sees it.
name: publish-server-image

on:
  push:
    branches: [main]
    # Everything the Containerfile COPYs, plus the pins it reads. `apps/` and
    # `libs/` are deliberately absent: nothing from them is in this image any
    # more (the agent programs build into agent-runtime, and every other app has
    # its own publish workflow), and a path that no COPY reads only made every
    # app commit rebuild the OS and reboot the host.
    paths:
      - "bootc/**"
      - "units/**"
      - "secrets/**"
      - "scripts/**"
      # The signature policy, its per-host registry table, the public key and the
      # shared sudoers and greenboot files ship in this image, and the build
      # renders the policy from them (SDLC #1024).
      - "lib/**"
      # The recovery reader's guard and config renderer ship in this image
      # (SDLC #953), so a change to either has to rebuild it.
      - "backrest/**"
      - ".github/workflows/publish-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-server-image
  cancel-in-progress: false

jobs:
  publish:
    name: build, push, sign, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: server-image
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo
      - name: install pinned cosign
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: the environment key matches the committed public key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -s lib/containers/cosign.pub
          cosign public-key --key env://COSIGN_PRIVATE_KEY >"$RUNNER_TEMP/cosign.pub"
          diff -u lib/containers/cosign.pub "$RUNNER_TEMP/cosign.pub"
      - name: permit the base pull for the builder
        # The runtime policy is the one that matters and is baked into the image.
        # The builder has no uCore public key and the base is a uCore stream tag,
        # so this bypass is limited to the build container.
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '%s' '{"default":[{"type":"insecureAcceptAnything"}]}' \
            >"$HOME/.config/containers/policy.json"
      - name: resolve the base digest
        # The base tracks the uCore stream tag, so the digest is whatever the tag
        # names when the build starts. Resolve it here rather than inside the
        # build: a registry failure fails the job before anything is built, and
        # the run summary and the image label both name the digest that build ran
        # on. The tag moves, so this digest is a record, not a pin.
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          base=$UCORE_IMAGE
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$base")
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::cannot resolve the base digest of $base: $digest"
            exit 1
          fi
          echo "BASE_DIGEST=$digest" >>"$GITHUB_ENV"
          {
            echo "### Base image"
            echo
            echo "- \`$base\` (stream tag)"
            echo "- \`${base}@${digest}\` (resolved by this run)"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          echo "base: ${base}@${digest}"
      - name: build
        run: scripts/build-image.sh
      - name: push, sign and verify the pushed digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . bootc/lib/pins.env
          tag="sha-${GITHUB_SHA::12}"
          image="${IMAGE_REPO}:${tag}"
          authfile="$RUNNER_TEMP/auth.json"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | podman login --authfile "$authfile" \
            ghcr.io -u "${{ github.actor }}" --password-stdin
          cp "$authfile" "$DOCKER_CONFIG/config.json"
          podman push --authfile "$authfile" --digestfile "$RUNNER_TEMP/digest" "$image"
          digest=$(cat "$RUNNER_TEMP/digest")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          # bootc/containers-image reads the legacy lookaside tag, not the OCI 1.1
          # referrer bundle cosign >=3 writes by default. Sign legacy, then prove
          # the `.sig` tag exists, because `cosign verify` alone reads the bundle
          # and would pass while the host rejects the image.
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$image@$digest"
          # The lookaside tag is <repo>:<sha256-hex>.sig, not repo:tag:<hex>.sig.
          skopeo inspect --raw "docker://${IMAGE_REPO}:${digest/:/-}.sig" >/dev/null
          cosign verify --key lib/containers/cosign.pub "$image@$digest"
          # `latest` is the operator's manual handle for `bootc switch` and
          # `bootc upgrade`; the install path and the deploy receiver stay
          # digest-only. It moves only after the digest is signed and verified,
          # and only from main, so a dispatch from a branch can never point it at
          # a build that would not have deployed.
          moved_latest=false
          # Builds are serialised in push order, so the newest push is the last
          # to run. Comparing against main's head instead skipped the tag
          # whenever a merge landed mid-build: four fixes in one hour produced
          # four images and moved `latest` once, leaving the host on an image
          # that predated the fix. The one way to walk the tag backwards is a
          # rerun of an older push, so a rerun does not move it.
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::notice::not moving :latest; this run is $GITHUB_REF, not main"
          elif [[ $GITHUB_RUN_ATTEMPT != 1 ]]; then
            echo "::notice::not moving :latest; attempt $GITHUB_RUN_ATTEMPT is a rerun"
          else
            # Copy the signed manifest by digest instead of re-pushing by tag:
            # --all copies the exact manifest, so the resulting digest cannot
            # drift from the one that was verified.
            skopeo copy --all --authfile "$authfile" \
              "docker://${IMAGE_REPO}@${digest}" "docker://${IMAGE_REPO}:latest"
            latest_digest=$(skopeo inspect --format '{{.Digest}}' \
              "docker://${IMAGE_REPO}:latest")
            if [[ $latest_digest != "$digest" ]]; then
              echo "::error::latest resolves to $latest_digest, not $digest"
              exit 1
            fi
            moved_latest=true
          fi
          {
            echo "### Derived server image"
            echo
            echo "- \`$image\`"
            echo "- \`${IMAGE_REPO}@${digest}\`"
            if [[ $moved_latest == true ]]; then
              echo "- \`${IMAGE_REPO}:latest\` (manual updates only)"
            fi
            echo
            echo "Pin the digest in \`ignition/operator/derived-image\`."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "pin: ${IMAGE_REPO}@${digest}"

  # The event path (design #798). A push to main tells the receiver that a build
  # landed; the receiver resolves the digest, checks the commit graph and boots the
  # image on its own. This job is therefore deliberately poor: no checkout, no
  # package token, no signing key. `needs:` makes it a statement about a build that
  # finished, never a gate on it, `permissions: {}` leaves it nothing to reach in
  # this repository, and `environment: deploy-notify` is a different Environment
  # from the signing one, so the deploy node shares no trust domain with the key.
  notify:
    name: notify the deploy receiver
    needs: publish
    # A main push builds and signs the image; deploying it is a deliberate
    # release, so the receiver is told only by an explicit workflow_dispatch.
    # The ref guard stays as well: a dispatch can name a branch, and only main
    # is a release. The Environment's branch policy is the second lock, not
    # the first.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: deploy-notify
    permissions: {}
    steps:
      # OAuth, not an authkey: the action mints a preauthorized key from the client,
      # so the node it creates is ephemeral and disappears with the job. The OAuth
      # client is scoped to `auth_keys` and carries only `tag:deploy`, which the ACL
      # accepts on nothing but the receiver's port.
      #
      # No `ping:` input: the ACL admits this node to one port, so a reachability
      # probe is a second question with its own failure mode. The POST below is the
      # check, and its failure names the receiver rather than the tailnet.
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:deploy
      - name: sign the body and notify the receiver
        env:
          # The same value the host holds as webhook-secret.yaml, in a main-only
          # Environment. Everything else the receiver needs it derives itself.
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/deploy-body.json"
          # One program builds the body and signs the file it just wrote: the key
          # is read from the environment, so it is in no argv and no log line, and
          # signing the file rather than a string is what makes "the bytes that
          # were signed" a thing curl can be handed.
          sig=$(python3 - "$body" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import sys
          import time

          now = int(time.time())
          payload = {
              "repo": os.environ["REPO_NAME"],
              "commit": os.environ["COMMIT_SHA"],
              "ts": now,
              "nonce": secrets.token_hex(16),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(json.dumps(payload, separators=(",", ":")) + "\n")
          with open(sys.argv[1], "rb") as handle:
              data = handle.read()
          key = os.environ["DEPLOY_WEBHOOK_SECRET"].encode()
          print(hmac.new(key, data, hashlib.sha256).hexdigest())
          PY
          )
          if [[ -z ${sig:-} ]]; then
            echo "::error::could not build the signed deploy body"
            exit 1
          fi
          # No timestamp header: the skew is read from the body's `ts`, which is
          # the value the HMAC covers. A header would be an unsigned second
          # answer to the same question, and the receiver has to pick one.
          #
          # --data-binary and not -d: `-d` strips newlines, so the bytes on the wire
          # would differ from the bytes that were signed and the receiver would
          # reject a body this job insists it sent.
          curl --fail-with-body --max-time 30 \
            -H "X-Deploy-Signature: sha256=$sig" \
            --data-binary @"$body" \
            http://smortress:8484/v1/deploy
