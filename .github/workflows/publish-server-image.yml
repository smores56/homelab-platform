# Builds, pushes, signs and verifies the smortress derived bootc image.
#
# The signing key is an environment secret; the public half is committed at
# image/cosign.pub and baked into the image and its Ignition policy. This
# workflow is push/workflow_dispatch only: a pull_request run never sees it.
name: publish-server-image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "units/**"
      - "secrets/**"
      - "scripts/**"
      - ".github/workflows/publish-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-server-image
  cancel-in-progress: false

jobs:
  publish:
    name: build, push, sign, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: server-image
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo
      - name: install pinned cosign
        run: |
          set -euo pipefail
          . image/pins.env
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: the environment key matches the committed public key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -s image/cosign.pub
          cosign public-key --key env://COSIGN_PRIVATE_KEY >"$RUNNER_TEMP/cosign.pub"
          diff -u image/cosign.pub "$RUNNER_TEMP/cosign.pub"
      - name: permit the base pull for the builder
        # The runtime policy is the one that matters and is baked into the image.
        # The builder has no uCore public key and the base is a uCore stream tag,
        # so this bypass is limited to the build container.
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '%s' '{"default":[{"type":"insecureAcceptAnything"}]}' \
            >"$HOME/.config/containers/policy.json"
      - name: resolve the base digest
        # The base tracks the uCore stream tag, so the digest is whatever the tag
        # names when the build starts. Resolve it here rather than inside the
        # build: a registry failure fails the job before anything is built, and
        # the run summary and the image label both name the digest that build ran
        # on. The tag moves, so this digest is a record, not a pin.
        run: |
          set -euo pipefail
          . image/pins.env
          base=$UCORE_IMAGE
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$base")
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::cannot resolve the base digest of $base: $digest"
            exit 1
          fi
          echo "BASE_DIGEST=$digest" >>"$GITHUB_ENV"
          {
            echo "### Base image"
            echo
            echo "- \`$base\` (stream tag)"
            echo "- \`${base}@${digest}\` (resolved by this run)"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          echo "base: ${base}@${digest}"
      # The build pushes its layer cache to the same registry, so the credential
      # must exist before the build; the push and cosign below reuse it.
      - name: log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/auth.json"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | podman login --authfile "$authfile" \
            ghcr.io -u "${{ github.actor }}" --password-stdin
          cp "$authfile" "$DOCKER_CONFIG/config.json"
          echo "REGISTRY_AUTH_FILE=$authfile" >>"$GITHUB_ENV"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >>"$GITHUB_ENV"
      - name: build
        env:
          # A sibling package, never IMAGE_REPO: the cache is a pile of unsigned
          # intermediate manifests and must not sit where a pullable image is
          # expected.
          CACHE_FROM: ghcr.io/smores56/homelab-platform-cache/server
          CACHE_TO: ghcr.io/smores56/homelab-platform-cache/server
        run: scripts/build-image.sh
      - name: push, sign and verify the pushed digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . image/pins.env
          tag="sha-${GITHUB_SHA::12}"
          image="${IMAGE_REPO}:${tag}"
          podman push --authfile "$REGISTRY_AUTH_FILE" --digestfile "$RUNNER_TEMP/digest" "$image"
          digest=$(cat "$RUNNER_TEMP/digest")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          # bootc/containers-image reads the legacy lookaside tag, not the OCI 1.1
          # referrer bundle cosign >=3 writes by default. Sign legacy, then prove
          # the `.sig` tag exists, because `cosign verify` alone reads the bundle
          # and would pass while the host rejects the image.
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$image@$digest"
          # The lookaside tag is <repo>:<sha256-hex>.sig, not repo:tag:<hex>.sig.
          skopeo inspect --raw "docker://${IMAGE_REPO}:${digest/:/-}.sig" >/dev/null
          cosign verify --key image/cosign.pub "$image@$digest"
          # `latest` is the operator's manual handle for `bootc switch` and
          # `bootc upgrade`; the install path and the deploy receiver stay
          # digest-only. It moves only after the digest is signed and verified,
          # and only from main, so a dispatch from a branch can never point it at
          # a build that would not have deployed.
          moved_latest=false
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            # A rerun of an older main push still reports refs/heads/main but
            # carries the old sha, so the ref alone would let a rerun walk the
            # tag backwards. Compare against main's current head instead.
            main_head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            if [[ $main_head != "$GITHUB_SHA" ]]; then
              echo "::notice::not moving :latest; $GITHUB_SHA is not main's head ($main_head)"
            else
              # Copy the signed manifest by digest instead of re-pushing by tag:
              # --all copies the exact manifest, so the resulting digest cannot
              # drift from the one that was verified.
              skopeo copy --all --authfile "$REGISTRY_AUTH_FILE" \
                "docker://${IMAGE_REPO}@${digest}" "docker://${IMAGE_REPO}:latest"
              latest_digest=$(skopeo inspect --format '{{.Digest}}' \
                "docker://${IMAGE_REPO}:latest")
              if [[ $latest_digest != "$digest" ]]; then
                echo "::error::latest resolves to $latest_digest, not $digest"
                exit 1
              fi
              moved_latest=true
            fi
          else
            echo "::notice::not moving :latest; this run is $GITHUB_REF, not main"
          fi
          {
            echo "### Derived server image"
            echo
            echo "- \`$image\`"
            echo "- \`${IMAGE_REPO}@${digest}\`"
            if [[ $moved_latest == true ]]; then
              echo "- \`${IMAGE_REPO}:latest\` (manual updates only)"
            fi
            echo
            echo "Pin the digest in \`ignition/operator/derived-image\`."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "pin: ${IMAGE_REPO}@${digest}"
