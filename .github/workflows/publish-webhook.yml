# Builds and pushes the webhook image; the steps are the shared contract in
# `_publish-image-unsigned.yml`.
name: publish-webhook

on:
  push:
    branches: [main]
    paths:
      - "apps/webhook/**"
      - ".github/workflows/publish-webhook.yml"
      - ".github/workflows/_publish-image-unsigned.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-webhook
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image-unsigned.yml
    with:
      name: webhook
      dockerfile: apps/webhook/Dockerfile
      context: apps/webhook
