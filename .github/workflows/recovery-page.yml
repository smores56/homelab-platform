# Typechecks, tests, and builds the recovery page on every change under
# apps/recovery-page/. It never deploys: a Cloudflare Pages deploy is a
# documented operator step with a Pages-only token (apps/recovery-page/README.md,
# "Deploy"). The artifact is uploaded for that human to inspect or deploy.
name: recovery-page

on:
  pull_request:
    paths:
      - "apps/recovery-page/**"
      - ".github/workflows/recovery-page.yml"
  push:
    branches: [main]
    paths:
      - "apps/recovery-page/**"
      - ".github/workflows/recovery-page.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.2
      - name: typecheck, test, and build
        working-directory: apps/recovery-page
        run: |
          set -euo pipefail
          deno task typecheck
          deno task test
          deno task build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-page-dist
          path: apps/recovery-page/dist
          if-no-files-found: error
          retention-days: 14
