# TEMPORARY one-off: copy the OpenTofu state objects from the plural R2 bucket
# to the singular one while the state token is widened to both. Delete this
# workflow once the backend flip has applied cleanly.
name: tofu-state-copy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: copy state objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION=auto
          endpoint=https://385f7d47e2e8438fbda5d6f76d760434.r2.cloudflarestorage.com
          mkdir -p "$HOME/.aws"
          printf '[default]\nregion = auto\ns3 =\n  addressing_style = path\n' >"$HOME/.aws/config"
          if ! command -v aws >/dev/null; then
            python3 -m pip install --quiet --user --break-system-packages --disable-pip-version-check awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z ${!name:-} ]]; then
              echo "::error::$name absent; the state token is not in this environment"
              exit 1
            fi
          done
          echo '== source'
          aws --endpoint-url "$endpoint" s3 ls --recursive s3://homelabs-tofu-state/
          echo '== copy'
          aws --endpoint-url "$endpoint" s3 sync s3://homelabs-tofu-state s3://homelab-tofu-state --only-show-errors
          echo '== target'
          aws --endpoint-url "$endpoint" s3 ls --recursive s3://homelab-tofu-state/
