# Builds, signs and proves the egress proxy image.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs.
name: publish-agent-egress

on:
  push:
    branches: [main]
    paths:
      - "apps/agent_egress/**"
      - "images/agent-egress/**"
      - ".github/workflows/publish-agent-egress.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-egress
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: agent-egress
      dockerfile: images/agent-egress/Containerfile
      pin_prefix: images/agent-egress/Containerfile
    secrets: inherit
