# Builds, signs and proves the agent runtime image.
#
# The steps are the shared contract in `_publish-image.yml`; this file owns only
# the trigger and the image-specific inputs.
name: publish-agent-runtime

on:
  push:
    branches: [main]
    paths:
      - "images/agent-runtime/**"
      - "apps/agent_facade/**"
      - "apps/brave_ingest/**"
      - "apps/agent_proxy/**"
      - "libs/data_plane/**"
      - ".github/workflows/publish-agent-runtime.yml"
      - ".github/workflows/_publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-runtime
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-image.yml
    with:
      name: agent-runtime
      dockerfile: images/agent-runtime/Containerfile
      pin_prefix: images/agent-runtime/Containerfile
    secrets: inherit
