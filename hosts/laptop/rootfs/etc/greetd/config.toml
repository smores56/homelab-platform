# greetd autologin into niri. The disk passphrase is the only password asked
# at power-on: the initial session starts without authentication, so the next
# prompt is Noctalia's lock screen after idle or an explicit lock.
#
# The user must exist before this runs; docs/laptop/switch.md covers both the in-place
# switch and a fresh install.
[terminal]
vt = 1

[initial_session]
user = "smores"
command = "niri-session"

# After a logout (niri exits), show a greeter instead of restarting the session
# forever. This path does ask for a password, by design.
[default_session]
user = "greeter"
command = "agreety --cmd niri-session"
