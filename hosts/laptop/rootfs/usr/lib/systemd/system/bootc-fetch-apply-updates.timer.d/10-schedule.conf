[Timer]
# The vendor unit fires at boot+1h and then every 8h with up to 2h of jitter,
# which would stage an update two or three times a day at times nobody chose.
# Both list options are cleared rather than overridden: an `OnCalendar=` beside
# them would add a window, not replace them, so the schedule would live in two
# places and the vendor one would still decide.
OnBootSec=
OnUnitInactiveSec=
RandomizedDelaySec=0
# One window, and it is the only one in the tree. The hour is arbitrary on this
# host in a way it is not on the servers: nothing here reboots, so all the window
# decides is when the download runs.
OnCalendar=daily
# The laptop is shut or asleep at midnight more often than not, so a missed
# window is the normal case rather than an outage: a persistent timer stages at
# the next resume instead of skipping a day. On the servers this is false because
# a burst of missed upgrades is what the stagger exists to prevent; here a missed
# stage just runs late, and `Persistent=true` is what keeps a laptop that is
# rarely on overnight from falling weeks behind.
Persistent=true
