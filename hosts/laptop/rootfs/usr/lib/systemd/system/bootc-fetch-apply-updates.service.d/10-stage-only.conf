[Service]
# The vendor unit is `bootc upgrade --apply`, which stages the new deployment and
# reboots into it: one hour after boot and every 8h with jitter, mid-session, into
# the disk's FIDO2 prompt. This laptop is never rebooted except by a person, so
# the vendor ExecStart is replaced with the plain stage: ostree-finalize-staged
# applies it at the next shutdown, and bootc-update-reminder tells that person it
# is waiting.
#
# The bare ExecStart= is the whole point: a drop-in appends to a unit's ExecStart=
# list, so without the reset `systemctl cat` shows two ExecStarts and the vendor
# one reboots the laptop anyway. Clearing first makes this file the only
# ExecStart= in the merged unit.
#
# `bootc upgrade --download-only` is not the alternative it looks like: it fetches
# without staging, and the reboot that would apply the download is the one this
# file exists to remove, so the update is discarded.
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
