# Portal selection for niri. Overrides the copy shipped by the niri package,
# which leaves the file chooser to xdg-desktop-portal-gnome; that chooser needs
# Nautilus, and this image has no GNOME file manager. The GTK portal is enough.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
