---
recovery_state_dir: /var/lib/homelab/recovery
recovery_sentinel: "{{ recovery_state_dir }}/sentinel.json"
recovery_entrypoint: /usr/local/sbin/homelab-clean-room-restore
recovery_check_script: /usr/local/sbin/homelab-recovery-check
# The fence file recover.yml writes after it stops every writer. A live restore
# into / is refused unless this file still exists.
recovery_writer_fence: "{{ data_plane_run_root }}/writers-fenced"
# Free-space estimate, in GiB, for a covering snapshot whose restic summary
# records no total_bytes_processed. recover.yml adds it to the restore's needs.
recovery_min_free_gb: 20
# Every required tier must hold the group's newest snapshot before a restore.
recovery_required_tiers:
  - nvme
  - hdd
  - r2
recovery_plan_schema_version: 1
recovery_backup_warn_hours: 24
