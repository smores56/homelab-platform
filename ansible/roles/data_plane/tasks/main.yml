---
- name: Require digest-pinned images for every service
  ansible.builtin.assert:
    that:
      - data_plane_images[item] is match('^[^@]+@sha256:[0-9a-f]{64}$')
    fail_msg: "Set data_plane_images.{{ item }} to repository@sha256:<64 hex>"
    quiet: true
  loop: "{{ data_plane_images.keys() | list }}"

- name: Require unique service names and a declared image key
  ansible.builtin.assert:
    that:
      - data_plane_services | map(attribute='name') | unique | length == (data_plane_services | length)
      - data_plane_services | selectattr('image_key', 'undefined') | list | length == 0
      - data_plane_services | map(attribute='image_key') | unique | length == (data_plane_images | length)
    fail_msg: "data_plane_services must be unique and use every declared image"

- name: Derive the backup cryptsetup units
  ansible.builtin.set_fact:
    data_plane_backup_crypt_units: >-
      {{ backup_mounts | map(attribute='source')
         | map('regex_replace', '^/dev/mapper/', 'systemd-cryptsetup@')
         | map('regex_replace', '$', '.service') | list }}

- name: Create the data-plane directory roots
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/homelab, mode: "0755" }
    - { path: "{{ data_plane_config_root }}", mode: "0750" }
    - { path: "{{ data_plane_secret_root }}", mode: "0700" }
    - { path: "{{ data_plane_state_root }}", mode: "0750" }
    - { path: "{{ data_plane_podman_root }}", mode: "0700" }
    - { path: "{{ data_plane_run_root }}", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Create each service state directory
  ansible.builtin.file:
    path: "{{ item.state_dir }}"
    state: directory
    owner: "{{ item.container_user | default(data_plane_default_container_user) | split(':') | first }}"
    group: "{{ item.container_user | default(data_plane_default_container_user) | split(':') | last }}"
    mode: "0750"
  loop: "{{ data_plane_services }}"
  loop_control:
    label: "{{ item.short }}"

# ReadWritePaths aborts namespace setup when a path does not exist, and podman
# cannot create the directory it is about to be granted.
- name: Create each service's podman storage root
  ansible.builtin.file:
    path: "{{ data_plane_podman_root }}/{{ item.short }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ data_plane_services }}"
  loop_control:
    label: "{{ item.short }}"

- name: Install the source catalog the broker reads
  ansible.builtin.copy:
    src: "{{ data_plane_source_catalog_src }}"
    dest: "{{ data_plane_config_root }}/sources.json"
    owner: root
    group: root
    mode: "0644"

# The broker writes a general tree owned by the host data user and group. It
# joins that group instead of running as the host user, and the setgid tree
# keeps files editable from both sides.
- name: Resolve the shared data group
  ansible.builtin.command:
    argv: [getent, group, "{{ homelab_data_group }}"]
  register: data_plane_data_lookup
  changed_when: false
  check_mode: false

- name: Require the shared data group on the host
  ansible.builtin.assert:
    that:
      - data_plane_data_lookup.rc == 0
      - data_plane_data_lookup.stdout.split(':') | length >= 3
    fail_msg: >-
      {{ homelab_data_group }} does not exist; create it before converging the
      broker.
    quiet: true

- name: Record the shared data gid
  ansible.builtin.set_fact:
    data_plane_data_gid: "{{ data_plane_data_lookup.stdout.split(':')[2] }}"

# The datasets are root-only infrastructure; only the directories a container
# mounts read-write belong to the container uid. /srv/books keeps the host data
# owner/group; the broker joins that group and writes through the setgid tree.
- name: Grant the container uid its writable state directories
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: directory
    owner: "{{ item.0.container_user | default(data_plane_default_container_user) | split(':') | first }}"
    group: "{{ item.0.container_user | default(data_plane_default_container_user) | split(':') | last }}"
    mode: "0700"
  loop: "{{ data_plane_services | subelements('writable_dirs', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Check for retired unit files
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}.service"
  loop: "{{ data_plane_retired_units }}"
  register: data_plane_retired_unit_files

- name: Stop and disable a retired unit
  ansible.builtin.systemd_service:
    name: "{{ item.item }}.service"
    enabled: false
    state: stopped
  loop: "{{ data_plane_retired_unit_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Remove a retired unit file
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.item }}.service"
    state: absent
  loop: "{{ data_plane_retired_unit_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  notify: Reload systemd

- name: Write the non-secret environment for each service
  ansible.builtin.template:
    src: env.j2
    dest: "{{ data_plane_config_root }}/{{ item.short }}.env"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ data_plane_services }}"
  loop_control:
    label: "{{ item.short }}"
  notify: Reload systemd

- name: Inspect the secret files the units mount
  ansible.builtin.stat:
    path: "{{ data_plane_secret_root }}/{{ item.src }}"
  loop: "{{ host_secret_files | selectattr('unit', 'defined') | list }}"
  loop_control:
    label: "{{ item.src }}"
  register: data_plane_secret_stats

- name: Fail closed on a missing or mis-permissioned secret file
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.uid == 0
      - item.stat.gid == data_plane_container_gid | int
      - item.stat.mode == host_secret_container_mode
    fail_msg: >-
      {{ item.item.src }} is missing or not root:{{ data_plane_container_gid }}
      {{ secrets_container_mode }}; install the operator bundle with
      `ansible-playbook playbooks/site.yml --tags secrets
      -e secrets_source_dir=<decrypted directory>`.
    quiet: true
  loop: "{{ data_plane_secret_stats.results }}"
  loop_control:
    label: "{{ item.item.src }}"

- name: Install the service units
  ansible.builtin.template:
    src: unit.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ data_plane_services }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Check each service's podman image store
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - --root
      - "{{ data_plane_podman_root }}/{{ item.short }}"
      - "{{ data_plane_images[item.image_key] }}"
  loop: "{{ data_plane_services }}"
  loop_control:
    label: "{{ item.short }}"
  register: data_plane_image_present
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the image archive into the stores that lack it
  ansible.builtin.command:
    argv:
      - podman
      - load
      - --root
      - "{{ data_plane_podman_root }}/{{ item.item.short }}"
      - --input
      - "{{ data_plane_image_archive }}"
  loop: "{{ data_plane_image_present.results }}"
  loop_control:
    label: "{{ item.item.short }}"
  when:
    - item.rc != 0
    - data_plane_image_archive | length > 0
  changed_when: true

- name: Recheck each service's podman image store
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - --root
      - "{{ data_plane_podman_root }}/{{ item.short }}"
      - "{{ data_plane_images[item.image_key] }}"
  loop: "{{ data_plane_services }}"
  loop_control:
    label: "{{ item.short }}"
  register: data_plane_image_recheck
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail closed on a missing image
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      {{ item.item.short }} has no {{ data_plane_images[item.item.image_key] }}
      in {{ data_plane_podman_root }}/{{ item.item.short }}; set
      data_plane_image_archive to an OCI archive or preload that store.
    quiet: true
  loop: "{{ data_plane_image_recheck.results }}"
  loop_control:
    label: "{{ item.item.short }}"

- name: Install the timers
  ansible.builtin.template:
    src: unit.timer.j2
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ data_plane_services | selectattr('timer', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Enable and start the long-running services
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ data_plane_services | selectattr('timer', 'undefined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.writer | default(false))

- name: Enable and start the scheduled timers
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ data_plane_services | selectattr('timer', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  # The backup timer is a writer too; it starts only under `--tags backup`.

- name: Verify every long-running service stayed up after start
  ansible.builtin.command: systemctl is-active --quiet {{ item.name }}.service
  register: data_plane_service_active
  retries: 5
  delay: 2
  changed_when: false
  failed_when: data_plane_service_active.rc != 0
  loop: "{{ data_plane_services | selectattr('timer', 'undefined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.writer | default(false))

- name: Verify every scheduled timer is active
  ansible.builtin.command: systemctl is-active --quiet {{ item.name }}.timer
  register: data_plane_timer_active
  retries: 5
  delay: 2
  changed_when: false
  failed_when: data_plane_timer_active.rc != 0
  loop: "{{ data_plane_services | selectattr('timer', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
