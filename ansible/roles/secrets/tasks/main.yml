---
# Operator-provided secret files only. Nothing here decrypts, prints, or
# templates a secret value: the operator decrypts the SOPS bundle outside the
# repository, points this role at that temporary directory, and wipes it after
# the run.
- name: Require an absolute operator secret source directory
  ansible.builtin.assert:
    that:
      - secrets_source_dir is string
      - secrets_source_dir | length > 0
      - secrets_source_dir is match('^/')
      - secrets_source_dir is not match('.*(^|/)\\.git(/|$).*')
    fail_msg: >-
      Set secrets_source_dir to an absolute path outside the repository that
      holds the decrypted operator files for this run.
    quiet: true

- name: Require a non-empty secret file list
  ansible.builtin.assert:
    that:
      - secrets_files is sequence
      - secrets_files | length > 0
    fail_msg: "secrets_files must list the files to install"
    quiet: true

- name: Require plain relative secret file names
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
      - item is not match('^/')
      # `is match` is anchored, so it would only catch a leading '..'; search
      # catches a traversal component anywhere in the entry.
      - item is not search('(^|/)\\.\\.(/|$)')
      - item != '.'
    fail_msg: >-
      secrets_files entries are paths below the source directory and may not be
      absolute or contain '..'.
    quiet: true
  loop: "{{ secrets_files }}"
  loop_control:
    label: "{{ item }}"

# The name check above cannot see through a symlink in the bundle. Resolve the
# real path so an entry cannot install a controller file from outside the
# decrypted directory at a mode the container can read.
- name: Require every secret to resolve inside the source directory
  ansible.builtin.assert:
    that:
      - (secrets_source_dir ~ '/' ~ item) | realpath is search('^' ~ (secrets_source_dir | realpath | regex_escape) ~ '/')
    fail_msg: >-
      {{ item }} resolves outside secrets_source_dir; the bundle may not
      contain symlinks that leave the decrypted directory.
    quiet: true
  loop: "{{ secrets_files }}"
  loop_control:
    label: "{{ item }}"

- name: Create the secret directory
  ansible.builtin.file:
    path: "{{ secrets_dest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# A nested entry such as `restic/r2.env` needs its parent before copy can place
# the file; copy never creates intermediate directories.
- name: Create each secret file's parent directory
  ansible.builtin.file:
    path: "{{ (secrets_dest_dir ~ '/' ~ item) | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ secrets_files }}"
  loop_control:
    label: "{{ item }}"

- name: Install each operator-provided secret file
  ansible.builtin.copy:
    src: "{{ secrets_source_dir }}/{{ item }}"
    dest: "{{ secrets_dest_dir }}/{{ item }}"
    owner: "{{ secrets_owner }}"
    group: "{{ secrets_group }}"
    mode: "{{ secrets_mode }}"
    force: true
  loop: "{{ secrets_files }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
