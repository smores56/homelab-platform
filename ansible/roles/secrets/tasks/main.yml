---
# Operator-provided secret files only. Nothing here decrypts, prints, or
# templates a secret value: the operator decrypts the bundle outside the
# repository, points this role at that directory, and wipes it after the run.
#
# The policy is `host_secret_files` in group_vars/all.yml. An entry with a unit
# is mounted by that unit on the data-plane host (root:container-gid 0640); an
# entry without one is read by a host daemon on the storage host (root:root
# 0600). The operator never passes a file list, so the install and the mount
# cannot drift.
- name: Require an absolute operator secret source directory
  ansible.builtin.assert:
    that:
      - secrets_source_dir is string
      - secrets_source_dir | length > 0
      - secrets_source_dir is match('^/')
      - secrets_source_dir is not match('.*(^|/)\\.git(/|$).*')
    fail_msg: >-
      Set secrets_source_dir to an absolute path outside the repository that
      holds the decrypted operator files for this run.
    quiet: true

- name: Require one well-formed secret policy
  ansible.builtin.assert:
    that:
      - host_secret_files is sequence
      - host_secret_files | length > 0
      - host_secret_files | selectattr('src', 'undefined') | list | length == 0
      - host_secret_files | map(attribute='src') | unique | length == host_secret_files | length
      - host_secret_files | rejectattr('src', 'match', '^[A-Za-z0-9._/-]+$') | list | length == 0
      - host_secret_files | rejectattr('src', 'search', '(^|/)\\.\\.(/|$)') | list | length == 0
    fail_msg: >-
      host_secret_files entries are unique relative paths of letters, digits,
      dot, underscore, slash and hyphen, with no '..' component.
    quiet: true

- name: Require a mount and a unit together
  ansible.builtin.assert:
    that:
      - (item.mount is defined) == (item.unit is defined)
      - item.mount is not defined or item.mount is match('^/run/secrets/')
    fail_msg: >-
      {{ item.src }} must name both `unit` and `mount` (a mounted file), or
      neither (a root-only file read by a host daemon).
    quiet: true
  loop: "{{ host_secret_files }}"
  loop_control:
    label: "{{ item.src }}"

# Resolve each source so a symlink cannot install a controller file from
# outside the decrypted directory.
- name: Require every secret to resolve inside the source directory
  ansible.builtin.assert:
    that:
      - (secrets_source_dir ~ '/' ~ item.src) | realpath is search('^' ~ (secrets_source_dir | realpath | regex_escape) ~ '/')
    fail_msg: >-
      {{ item.src }} resolves outside secrets_source_dir; the bundle may not
      contain symlinks that leave the decrypted directory.
    quiet: true
  loop: "{{ host_secret_files }}"
  loop_control:
    label: "{{ item.src }}"

- name: Select the entries this host reads
  ansible.builtin.set_fact:
    secrets_host_entries: >-
      {{ (host_secret_files | selectattr('unit', 'defined') | list
          if inventory_hostname in groups.get('data_plane_hosts', []) else [])
         + (host_secret_files | rejectattr('unit', 'defined') | list
          if inventory_hostname in groups.get('storage_hosts', []) else []) }}

- name: Create the secret directory
  ansible.builtin.file:
    path: "{{ secrets_dest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create each secret file's parent directory
  ansible.builtin.file:
    path: "{{ (secrets_dest_dir ~ '/' ~ item.src) | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ secrets_host_entries }}"
  loop_control:
    label: "{{ item.src }}"

- name: Read the current secret checksums
  ansible.builtin.stat:
    path: "{{ secrets_dest_dir }}/{{ item.src }}"
    get_checksum: true
  loop: "{{ secrets_host_entries }}"
  loop_control:
    label: "{{ item.src }}"
  register: secrets_before

# The copy owns the final owner/group/mode, so a drifted mode is corrected on
# every run and there is no second writer of the same file.
- name: Install each operator-provided secret file
  ansible.builtin.copy:
    src: "{{ secrets_source_dir }}/{{ item.src }}"
    dest: "{{ secrets_dest_dir }}/{{ item.src }}"
    owner: root
    group: "{{ data_plane_container_gid if item.unit is defined else 'root' }}"
    mode: "{{ host_secret_container_mode if item.unit is defined else host_secret_root_mode }}"
    force: true
  loop: "{{ secrets_host_entries }}"
  loop_control:
    label: "{{ item.src }}"
  register: secrets_installed
  no_log: true

- name: Reset the changed-unit list
  ansible.builtin.set_fact:
    secrets_changed_units: []

- name: Collect units whose secret content changed
  ansible.builtin.set_fact:
    secrets_changed_units: "{{ secrets_changed_units + [item.0.item.unit] }}"
  loop: "{{ secrets_installed.results | zip(secrets_before.results) | list }}"
  loop_control:
    label: "{{ item.0.item.src }}"
  when:
    - item.0.item.unit is defined
    - item.0.checksum | default('') != item.1.stat.checksum | default('')

- name: Check the unit files whose secret changed
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}.service"
  loop: "{{ secrets_changed_units }}"
  loop_control:
    label: "{{ item }}"
  register: secrets_unit_files

# try-restart restarts a running unit and does nothing to a stopped one, which
# is what keeps a recovery-fenced unit fenced.
- name: Restart a running unit whose secret changed
  ansible.builtin.command:
    argv: [systemctl, try-restart, "{{ item.item }}.service"]
  loop: "{{ secrets_unit_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  changed_when: true
