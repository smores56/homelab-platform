#!/usr/sbin/nft -f
# The edge's host firewall (design #725). The ctrl panel firewall in front of it
# allows 443, udp/41641 and ICMP echo; this file is the second layer, so a panel
# rule that drifts open still meets a closed host.
#
# 22 is accepted on the tailnet interface only: the edge's login is tailnet-only
# and the ACL decides which devices may take it, exactly as sshd on smortress
# works (design #767). The host does not name a tailnet address anywhere, so a
# rebuild that gets a new one changes nothing here.
#
# Everything arriving on tailscale0 is accepted because the tailnet policy is
# the filter for it; everything arriving on the public interface is accepted
# only on the two ports the edge exists to serve.
# Only this table is replaced, never the whole ruleset: tailscaled installs its
# own chains on the tailnet interface, and `flush ruleset` would drop them until
# it reconciles.
destroy table inet edge

table inet edge {
	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		ct state established,related accept

		iifname "tailscale0" accept

		# Direct WireGuard, so the tailnet does not fall back to DERP, and ICMP
		# echo for path-MTU diagnosis of the proxied connections.
		udp dport 41641 accept
		meta l4proto icmp icmp type echo-request limit rate 10/second accept
		meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 10/second accept

		tcp dport 443 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
