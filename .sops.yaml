# How this repository holds secrets
#
# Two stores, two audiences, no overlap:
#
#   secrets/*.yaml            operator tooling (tofu runs, scripted applies,
#                             the host-secret bundles the operator unpacks).
#                             Encrypted to the admin identity and the three
#                             YubiKeys; no host identity can decrypt it, so a
#                             secret reaches the host only after an operator
#                             unpacks it.
#   secrets/server/*.yaml     image-carried ciphertext the host decrypts at boot.
#                             Encrypted to the machine identity as well, because
#                             `sops-decrypt.service` on the host has to read it;
#                             admin and the YubiKeys stay in the rule so the
#                             files remain editable without the host.
#
# The admin identity is the operator's passphrase-wrapped age key, listed first
# in every rule so a no-token decrypt prompts once. The three YubiKeys are
# touch-only operator readers; a handle is a bearer grant once a token is
# present. The shared machine identity is the unattended root reader for the
# image-carried ciphertext: it is staged root-only under /var, kept in
# Bitwarden, and removed from this rule after the host proves it.
keys:
  - &admin age1skuwunreduvw8gtkzyf9atsyjnku388ly8c252h3qger84fg5d7q4kf6xs
  # Shared unattended machine identity (age-keygen); the private key is a
  # Bitwarden attachment and a pending recovery-kit row, never in this repo.
  - &machine age1dy66kuzcvu7tgl64pxrjymdt3ndk7g2ftsqc0nx4s8fhyv8zfyyq2h0756
  # The three `age-plugin-fido2-hmac -g` recipients (no PIN, separate identity).
  - &yk1 age18suc3usnfah6g3fldvhhvmchyupg3tp2p5vgzfuprvcn6untva9qem4lf0
  - &yk2 age1zepedng5vqafu95hysrxl0kadreshg2yc07epfqky5fuq2nmy5fqg649lf
  - &yk3 age1xqpw0qy2mk98ptvvh5y0sxtlrxs036nng2868zd6dc4wdcrrm5mqd6pnpf

creation_rules:
  # Image-carried ciphertext (T2). The boot decrypt unit must read these files;
  # admin and the YubiKeys keep the operator able to edit them without the host.
  - path_regex: ^secrets/server/.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *machine
          - *yk1
          - *yk2
          - *yk3
  - path_regex: ^secrets/.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *machine
          - *yk1
          - *yk2
          - *yk3
