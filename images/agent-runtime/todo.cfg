# Sourced by todo.sh. The one list lives in the Syncthing file plane, and the
# /usr/local/bin/todo wrapper passes this file with -d so a writable $HOME
# cannot shadow it.
export TODO_DIR=/srv/files/todos
: ${TODO_FILE:="${TODO_DIR}/todo.txt"}
: ${DONE_FILE:="${TODO_DIR}/done.txt"}
: ${REPORT_FILE:="${TODO_DIR}/report.txt"}
export TODO_FILE DONE_FILE REPORT_FILE

# No ANSI codes when the output is piped and no "N added" noise on stdout.
export TODOTXT_PLAIN=1
export TODOTXT_VERBOSE=0
# `do` marks the line in place; archiving is an explicit `archive`.
export TODOTXT_AUTO_ARCHIVE=0
# A new line carries a creation date, like tuxedo's and the phone capture's.
export TODOTXT_DATE_ON_ADD=1
# `del` removes the line instead of leaving a blank line in the list.
export TODOTXT_PRESERVE_LINE_NUMBERS=0
