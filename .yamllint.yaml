---
extends: default

ignore: |
  manifests/
  .terraform/
  # SOPS ciphertext: base64 blobs and a sops metadata block, neither hand-edited.
  secrets/

rules:
  line-length:
    max: 160
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  document-start: disable
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
