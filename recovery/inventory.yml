---
# The storage inventory the recovery plan is built from. Every key here is read
# by `scripts/render-recovery-groups.py` or by the backup policy beside it
# (`recovery/backup.yml`); nothing else belongs in this file.

zfs_pool: tank
zfs_pool_luks_volume: luks-data
zfs_pool_device: "/dev/mapper/{{ zfs_pool_luks_volume }}"

# One recovery group per parent dataset. A dataset whose `recovery_group` names
# no entry here, or an entry with no dataset, is refused by the renderer, so a
# new dataset cannot silently fall out of the plan.
recovery_inventory:
  books:
    visibility: general
  memory_external:
    visibility: personal
  memory_local:
    visibility: personal
  music:
    visibility: personal
  notes:
    visibility: personal
  photos:
    visibility: personal
  wallpapers:
    visibility: personal
  data_plane_state:
    visibility: infrastructure
  browsing:
    visibility: personal
  finance:
    visibility: personal
  mail:
    visibility: personal

# Host paths outside the ZFS pool that still form a recovery group. One
# recursive snapshot cannot capture them, so the backup unit reads the live
# path; the group is declared here so no inventory-less group can exist.
backup_host_paths:
  - id: host-keys
    path: /var/lib/sbctl

# The datasets under each recovery group, with the mountpoint the renderer
# checks against the group's subtree. `scripts/storage-layout.sh` owns the rest
# of the layout (recordsize, mode and the mount endpoints), so only the three
# keys the plan reads are repeated here.
zfs_datasets:
  - name: "{{ zfs_pool }}/books"
    mountpoint: /srv/books
    recovery_group: books
  - name: "{{ zfs_pool }}/memory/external"
    mountpoint: /srv/memory/external
    recovery_group: memory_external
  - name: "{{ zfs_pool }}/memory/local"
    mountpoint: /srv/memory/local
    recovery_group: memory_local
  - name: "{{ zfs_pool }}/music"
    mountpoint: /srv/music
    recovery_group: music
  - name: "{{ zfs_pool }}/notes"
    mountpoint: /srv/notes
    recovery_group: notes
  - name: "{{ zfs_pool }}/photos"
    mountpoint: /srv/photos
    recovery_group: photos
  - name: "{{ zfs_pool }}/wallpapers"
    mountpoint: /srv/wallpapers
    recovery_group: wallpapers
  - name: "{{ zfs_pool }}/data-plane/events"
    mountpoint: /var/lib/data-plane/events
    recovery_group: data_plane_state
  - name: "{{ zfs_pool }}/data-plane/intents"
    mountpoint: /var/lib/data-plane/intents
    recovery_group: data_plane_state
  - name: "{{ zfs_pool }}/data-plane/manifests"
    mountpoint: /var/lib/data-plane/manifests
    recovery_group: data_plane_state
  - name: "{{ zfs_pool }}/browsing/catalog"
    mountpoint: /srv/browsing/catalog
    recovery_group: browsing
  - name: "{{ zfs_pool }}/browsing/raw"
    mountpoint: /srv/browsing/raw
    recovery_group: browsing
  - name: "{{ zfs_pool }}/finance/ledger"
    mountpoint: /srv/finance/ledger
    recovery_group: finance
  - name: "{{ zfs_pool }}/finance/hledger"
    mountpoint: /srv/finance/hledger
    recovery_group: finance
  - name: "{{ zfs_pool }}/mail/messages"
    mountpoint: /srv/mail/messages
    recovery_group: mail
  - name: "{{ zfs_pool }}/mail/index"
    mountpoint: /srv/mail/index
    recovery_group: mail

# The file set the host-secret bundle must supply: one entry per file, relative
# to the secret root, with `unit` and `mount` for a file a unit mounts.
# `scripts/unpack-host-secrets.py` writes them and
# `tests/data-plane/test_host_secrets_bundle.py` asserts the two agree, so a
# bundle key with no declared file (or the reverse) fails before the host starts.
host_secret_files:
  - src: restic/data-plane.password
  - src: restic/r2.env
  - src: event-service/append-token
    unit: homelab-event-service
    mount: /run/secrets/event/append-token
  - src: event-service/read-token
    unit: homelab-event-service
    mount: /run/secrets/event/read-token
  - src: event-service/consumers.json
    unit: homelab-event-service
    mount: /run/secrets/event/consumers.json
  - src: write-broker/identity
    unit: homelab-write-broker
    mount: /run/secrets/broker/identity
  - src: write-broker/operator-key
    unit: homelab-write-broker
    mount: /run/secrets/broker/operator-key
