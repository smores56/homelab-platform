# The two agent shell runners (SDLC #715, T5 of #702). Each is a login-less,
# unprivileged account that runs only its own trust class's Podman containers:
# systemd-sysusers allocates the ids, so the uid-keyed egress rules and the
# tmpfiles homes name the accounts rather than a number that can move. The homes
# are Podman's rootless storage (image layers and container metadata), not a
# workspace: no job mounts either one.
g agent-shell-personal -
u agent-shell-personal - "agent personal shell runner" /var/lib/agent-shell/personal /usr/sbin/nologin
g agent-shell-general -
u agent-shell-general - "agent general shell runner" /var/lib/agent-shell/general /usr/sbin/nologin
