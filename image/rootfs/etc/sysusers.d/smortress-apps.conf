# The apps tenant runs as one unprivileged, login-less user (SDLC #726, T7 of
# #701). Its uid is fixed because the nftables egress rule and the dataset
# ownership name it numerically, and nft resolves a user name only at load time.
g apps 1001
u apps 1001:1001 "apps tenant" /var/home/apps /usr/sbin/nologin
