# The apps tenant runs as one unprivileged, login-less user (SDLC #726, T7 of
# #701). The id stays fixed for what names it numerically: the raw/apps dataset
# owner that init-zpool sets before sysusers has run, and the user@1001 manager
# drop-ins. The egress rules are not a reason any more; they name the account,
# which nft resolves at load time. systemd-sysusers does not fail when 1001 is
# taken, it allocates the next free uid, so verify `id apps` on a fresh host.
g apps 1001
u apps 1001:1001 "apps tenant" /var/home/apps /usr/sbin/nologin
