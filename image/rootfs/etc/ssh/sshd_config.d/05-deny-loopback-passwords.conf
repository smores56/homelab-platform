# smortress sshd (design #748). Access through the tunnel is the only route in,
# and the loopback Match block at the end of this file is what keeps that route
# key-only. Read that block before renaming this file.

# cloudflared dials localhost, so the listener is loopback-only in both
# families. Nothing binds the tailnet address, which is why retiring Tailscale
# SSH needs no firewall change.
ListenAddress 127.0.0.1
ListenAddress ::1

# Every client now arrives from 127.0.0.1. The per-source penalty counter would
# otherwise be shared by all of them, so one bad password could ban the only
# route in for up to 600s.
PerSourcePenaltyExemptList 127.0.0.1,::1

# Console logins use the local getty and the core password; SSH accepts keys
# only.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers smores

# The authorised set is Ignition's file, not ~/.ssh. The dot-prefixed directory
# is what Fedora's file_contexts maps to ssh_home_t, so sshd reads it with no
# semanage and no custom policy module; /var/lib/homelab/ssh would be var_lib_t
# and denied. bootc does not reconcile /var, so the file arrives from Ignition
# rather than the image.
AuthorizedKeysFile /var/lib/homelab/.ssh/authorized_keys

# The docked token cannot prove presence, so a touch is not asked for: the
# resident sk- handles are authorised with no-touch-required. A PIN is still
# required unless a key opts out with no-verify-required in authorized_keys.
PubkeyAuthOptions verify-required

# nix-config's hardening, carried over with the reasons. Agent forwarding is off
# because nothing needs it once Access is the route, and every forwarding
# channel is an egress path a compromised session did not need.
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
PermitUserRC no
# Ten tries is generous for a key-only listener and still bounded.
MaxAuthTries 10
LoginGraceTime 60

# Locale only. sshd never passes PATH or LD_* whatever this list says.
AcceptEnv LANG LC_*

# Why this file is named 05- and not 10-: uCore ships
# 90-enable-localhost-passwords.conf, which sets PasswordAuthentication yes for
# `Match Address 127.0.0.1,::1` so Cockpit's web login can use the core
# password. sshd parses its configuration twice; the second pass re-reads only
# the matching Match blocks, with first-obtained-value semantics, so the
# earliest matching file wins and a later one cannot undo it. Repeating the same
# criterion here with `no` is what stops uCore from re-enabling password auth on
# every loopback connection, which would collapse the AND property (Access token
# plus key) on the only route in. A drop-in sorting after 90- is silently
# ignored.
Match Address 127.0.0.1,::1
  PasswordAuthentication no
