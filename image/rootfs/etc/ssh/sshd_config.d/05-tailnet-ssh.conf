# smortress sshd (design #748, rerouted by #767). The tailnet is the only route
# in and firewalld is the filter; the loopback Match block at the end of this
# file is what keeps every route key-only. Read that block before renaming this
# file.

# No ListenAddress at all, so sshd listens on every local address and the
# firewall decides who reaches it: the default zone is `drop`
# (image/Containerfile, `firewall-offline-cmd --set-default-zone=drop`) and only
# tailscale0 is assigned to the `tailscale` zone, which accepts `ssh` and
# Syncthing's 22000 (image/rootfs/etc/firewalld/zones/tailscale.xml). The tailnet
# address is per node and cannot be known at build time, so the interface, not
# an address, is the gate. LAN interfaces sit in `drop`; the bring-up window is
# the `bootstrap` zone (scripts/access-bootstrap.sh), which ssh also needs.
#
# During the cutover the Cloudflare connector still dials localhost, and it
# reaches this same listener: firewalld accepts loopback unconditionally, so the
# tunnel keeps working until #767's T6 deletes it.

# Console logins use the local getty and the core password; SSH accepts keys
# only.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers smores

# The authorised set ships in the image, one ed25519 line, and a key change
# arrives with `bootc upgrade`. /etc/ssh is `etc_t` and world-readable, which is
# all sshd needs: it opens this path as root, and the file is root-owned 0644.
# That replaced the Ignition-delivered /var/lib/homelab/.ssh pair, where sshd had
# to open the file as smores and the path therefore needed a smores-owned
# directory under a 0711 /var/lib/homelab plus ssh_home_t labelling — machinery
# that existed only because bootc does not reconcile /var. An image path needs
# none of it, and nothing hand-written can drift from the running deployment.
AuthorizedKeysFile /etc/ssh/authorized_keys.d/smores

# PubkeyAuthOptions is deliberately absent, which leaves it at its default
# (`none`). verify-required is a hard requirement rather than a permission:
# sshd then rejects every FIDO signature that lacks the UV assertion, and
# authorized_keys carries no no-verify-required option to cancel it per key, so
# a touch-free resident sk- login (a key made with `-O no-touch-required`,
# authorised with `no-touch-required`) could never authenticate. touch-required
# is not set either: leaving both unset is what lets each authorized_keys line
# decide. The sk- keys leave SSH in #767's T7; until then the default is what
# keeps the per-key option meaningful.

# nix-config's hardening, carried over with the reasons. Agent forwarding is off
# because no route needs it, and every forwarding channel is an egress path a
# compromised session did not need.
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
PermitUserRC no
# Ten tries is generous for a key-only listener and still bounded.
MaxAuthTries 10
LoginGraceTime 60

# Locale only. sshd never passes PATH or LD_* whatever this list says.
AcceptEnv LANG LC_*

# Why this file is named 05- and not 10-: uCore ships
# 90-enable-localhost-passwords.conf, which sets PasswordAuthentication yes for
# `Match Address 127.0.0.1,::1` so Cockpit's web login can use the core
# password. sshd parses its configuration twice; the second pass re-reads only
# the matching Match blocks, with first-obtained-value semantics, so the
# earliest matching file wins and a later one cannot undo it. Repeating the same
# criterion here with `no` is what stops uCore from re-enabling password auth on
# every loopback connection — cloudflared's cutover route and Cockpit both arrive
# that way. A drop-in sorting after 90- is silently ignored.
Match Address 127.0.0.1,::1
  PasswordAuthentication no
