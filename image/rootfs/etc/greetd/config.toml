# greetd autologin into niri. The disk passphrase is the only password asked
# at power-on: greetd's default session starts without authentication, so the
# next prompt is Noctalia's lock screen after idle or an explicit lock.
#
# The user must exist before this runs; docs/switch.md covers both the in-place
# switch and a fresh install.
[terminal]
vt = 1

[default_session]
user = "smores"
command = "niri-session"
