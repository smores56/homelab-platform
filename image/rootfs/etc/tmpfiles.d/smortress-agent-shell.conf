# Rootless Podman storage for the two shell runners (SDLC #715). The account is
# the owner because systemd-sysusers allocates its id; a numeric owner here
# would point at nobody after the account moved. 0700 keeps one runner's image
# store and container metadata out of the other's reach. The runtime directory
# is where systemd-run points XDG_RUNTIME_DIR for the transient job unit; the
# dispatcher creates the per-runner child at launch.
d /var/lib/agent-shell 0755 root root -
d /var/lib/agent-shell/personal 0700 agent-shell-personal agent-shell-personal -
d /var/lib/agent-shell/general 0700 agent-shell-general agent-shell-general -
d /run/smortress/agent-job 0700 root root -
