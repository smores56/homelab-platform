# Runtime state for decrypted secrets and the root-only key staging area.
# The age identity and the HDD keyfile arrive from the offline recovery kit;
# tmpfiles only creates the empty, root-only directories.
d /run/smortress 0700 root root -
d /run/smortress/secrets 0700 root root -
# 0711, not 0700: every child stays root-only, but smores has to be able to
# enter the directory to reach the age identity's children and the tailscale
# marker that smortress-tailscale-up.service creates and re-asserts with the
# same mode. sshd reads nothing here any more: the login key moved to
# /etc/ssh/authorized_keys.d (image/rootfs/etc/ssh/sshd_config.d/05-tailnet-ssh.conf).
d /var/lib/homelab 0711 root root -
d /var/lib/homelab/age 0700 root root -
d /var/lib/homelab/keys 0700 root root -
# Deploy state (design #798): the queue the receiver writes, the work tree the
# applies stage into, and the records the drain owns. Outside every recovery
# group on purpose -- the journal and `bootc status` rebuild it -- and root-only,
# because the denylist and the held/staged records decide what may run next.
d /var/lib/homelab/deploy 0700 root root -
d /var/lib/homelab/deploy/queue 0700 root root -
d /var/lib/homelab/deploy/work 0700 root root -
# The Restic plane's state tree. Its own driver creates it, but the deploy drain
# lists it in ReadWritePaths (the snapshot gate backs a restore unit up before a
# reboot), and a ReadWritePaths path that does not exist fails the unit.
d /var/lib/homelab/restic 0700 root root -
# The backup driver publishes live progress here for the operator account, so it
# is deliberately not under the 0700 state tree. Created at boot because the
# deploy unit's ProtectSystem=strict namespace needs the path to exist before it
# can be added to ReadWritePaths.
d /var/lib/homelab/restic-progress 0755 root root -
# The rendered tenant plan lives here so the Serve wiring survives a reboot.
d /var/lib/homelab/apps 0700 root root -
# The tenant user's home and its user manager. Linger starts the manager at
# boot without a login session, which is what a rootless Quadlet needs.
d /var/home/apps 0700 apps apps -
d /var/lib/systemd/linger 0755 root root -
f /var/lib/systemd/linger/apps 0644 root root -
# Application state that is deliberately outside every recovery group: the
# machine learning model cache is regenerable, and Syncthing's version history
# is a convenience the legacy stack also kept out of its backups. The owner is
# the numeric uid/gid the containers run as, not a login: the image ships no
# sysusers entry, and naming a user it does not create makes tmpfiles drop the
# line and every unit that mounts the directory fail with statfs ENOENT.
d /var/lib/immich 0755 root root -
d /var/lib/immich/ml-cache 0750 1000 1000 -
d /var/lib/immich/valkey 0750 1000 1000 -
d /var/lib/syncthing/versions 0750 1000 1000 -
# Parent of the three agent datasets, declared for the same reason as
# /var/lib/immich above: the datasets are created and mounted by the pool unit, so
# only the directory they hang under is tmpfiles' business.
d /var/lib/agent 0755 root root -
d /etc/luks 0700 root root -
