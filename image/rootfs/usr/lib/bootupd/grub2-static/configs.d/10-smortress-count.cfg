# Boot counting without a package (SDLC #798, T4).
#
# bootupd installs this beside the boot entries and grub runs it on every boot,
# before any userspace: the post-boot gate cannot rescue a deployment that never
# starts, so the counter is the only thing that falls back when the kernel, the
# initramfs or PID 1 never reach it.
#
# The semantics are greenboot's GREENBOOT_MAX_BOOT_ATTEMPTS=3, reimplemented here
# because the image takes no distribution package. Each boot is unproven
# (boot_success=0) and spends one attempt; once the attempts are gone, BLS entry
# 1 -- the previous deployment bootc keeps beside the current one -- is selected
# and the counter is marked spent, so later boots do not rotate further while the
# operator decides. The gate writes boot_success=1 and boot_counter=3 back when
# the deployment it booted is healthy, and unsets `default` on every abandon so a
# spent counter cannot re-select the deployment that just failed.
if [ -f (${root})/grub2/grubenv ]; then
  load_env
  set boot_success=0
  if [ -z "${boot_counter}" ]; then
    set boot_counter=3
  fi
  if [ "${boot_counter}" -gt 0 ]; then
    set boot_counter=$((boot_counter - 1))
    save_env boot_success boot_counter
  else
    set default=1
    set boot_counter=-1
    save_env boot_success boot_counter default
  fi
fi
