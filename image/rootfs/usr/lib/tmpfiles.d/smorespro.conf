# Runtime state directories these packages create, declared so bootc can
# regenerate them from tmpfiles instead of relying on unpacked /var content.
# Without this the image carries stateful directories whose ownership and modes
# are frozen at build time.
d /var/lib/AccountsService 0775 root root -
d /var/lib/AccountsService/icons 0775 root root -
d /var/lib/AccountsService/users 0700 root root -
d /var/lib/alsa - - - -
d /var/lib/bluetooth 0700 root root -
d /var/lib/bluetooth/mesh 0700 root root -
d /var/lib/fprint 0700 root root -
d /var/lib/geoclue 0700 geoclue geoclue -
d /var/lib/greetd 0700 greetd greetd -
d /var/lib/plymouth 0755 root root -
d /var/lib/tailscale 0700 root root -
d /var/lib/tuned 0755 root root -
d /var/cache/tailscale 0700 root root -
d /var/spool/plymouth 0755 root root -
d /var/lib/greetd/.config 0755 greetd greetd -
d /var/lib/greetd/.config/systemd 0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd -
d /var/lib/flatpak 0755 root root -
d /var/log/tuned 0755 root root -
# Declared after its parents: systemd-tmpfiles does not create a missing parent
# for an L line mid-run. greetd ships the same mask for its greeter user; this
# copy is what the image's /var content is checked against.
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
