[Service]
# The health check waits for this host's units, and this host's units wait for
# the ZFS pool. The post-boot gate this replaces allowed itself 300 s for the
# same wait (scripts/smortress-boot-gate.sh: gate_budget), while a oneshot keeps
# systemd's 90 s default -- so without this the unit would be killed mid-wait,
# read as a failed check, and greenboot would roll back a deployment that was
# only slow to serve.
TimeoutStartSec=600
