# One calendar pass: the exporter signs in with its sealed session and rewrites
# the entity directory, the template's collection stage commits it to the replica
# state, and the projection publishes the readable view.
#
# The exporter talks to Tuta on the collectors' network and needs an address; the
# collection stage needs that network too, because it runs right after the
# exporter against the same account; the projection reads what the collection
# published and gets `none`, because it needs no socket at all. Neither can reach a
# deployment, the facades, the model or a UI.
[Unit]
Description=Dump Tuta calendar entities into the personal replica
Requires=sops-decrypt.service smortress-app-secrets.service agent-collect-network.service
After=sops-decrypt.service smortress-app-secrets.service agent-collect-network.service network-online.target
Wants=network-online.target
# The seal only exists after an operator has signed in (docs/manual-steps.md
# 40.16); until then the timed run is skipped rather than reported as broken.
ConditionPathExists=/var/lib/agent/local/quarantine/tuta-calendar/session.gpg

[Service]
# Stage 1: the exporter, which holds the account session. The store is mounted at
# /data because that is where `init` sealed it; the entity directory is a separate
# mount so a dump can be inspected or deleted without touching the session.
# `--replace` clears a container a killed run left behind, and read-only root
# leaves it only /tmp and those two mounts to write. It runs the calendar image,
# not the runtime: the Tuta client is its own build, so this is the one stage here
# that names an image of its own.
ExecStartPre=/usr/bin/podman run --rm --replace --name smortress-agent-calendar-dump \
  --network systemd-agent-collect \
  ${AGENT_COLLECT_HARDENING} \
  --tmpfs /tmp:rw,size=64m \
  --volume /var/lib/agent/local/quarantine/tuta-calendar:/data:z \
  --volume /var/lib/agent/local/quarantine/calendar:/entities:z \
  --env HOME=/tmp \
  ghcr.io/smores56/homelab-platform/tuta-calendar@sha256:c2eb3babf933250fefc9ead2cf993e5dd7c4b009e1ed00138315d46c44822111 \
  dump --store /data --out /entities
# Stage 2, the template's collection stage: commit what the dump wrote. The
# collector derives the ICS projection itself and carries a vanished event forward
# with an absence reason: the SDK lists events and never says one was deleted, so
# silence is not a tombstone. The entity directory is read-only here -- the dump
# stage above is the only writer.
Environment=AGENT_COLLECT_NETWORK=systemd-agent-collect
Environment="AGENT_COLLECT_SOURCE=--volume /var/lib/agent/local/quarantine/calendar:/entities:ro"
Environment="AGENT_COLLECT_ARGS=calendar --entities /entities"
# Stage 3: the projection. No network, no secret, the replica read-only: its whole
# input is the committed state and its whole output is one vdir under the personal
# index dataset -- `events/<uid>.ics`, one VEVENT per file, plus `state.json`. No
# event is expanded: an RRULE is carried through as the provider stated it, and a
# tombstoned event's file is removed because the view is current state and not
# history.
ExecStart=/usr/bin/podman run --rm --replace --name smortress-agent-calendar-publish \
  --network none \
  ${AGENT_COLLECT_HARDENING} \
  --tmpfs /tmp:rw,size=16m \
  --volume /var/lib/agent/local/replica:/replica:ro \
  --volume /var/lib/agent/local/sources/calendar:/out:z \
  ${AGENT_COLLECT_ENV} \
  --entrypoint python3 \
  ${AGENT_COLLECT_IMAGE} \
  -m data_plane.collectors.raw.publish_calendar --raw /replica/calendar --out /out
# A dump walks every event page through Tuta's API.
TimeoutStartSec=900
