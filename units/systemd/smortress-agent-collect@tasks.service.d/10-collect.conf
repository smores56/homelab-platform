# One tasks pass: todo.txt and done.txt become one committed state.
#
# Same shape as the notes pass and for the same reason: two files on disk, no
# provider, no network, no secret. The directory is mounted read-only and the
# replica tree is the only writable mount.
#
# The collector refuses a directory without todo.txt, so a mistyped or unmounted
# path stops the replica advancing instead of committing an empty list that
# carries every task away.
[Unit]
Description=Publish the todo.txt list into the personal replica
Requires=zfs-ready@raw-files.service
After=zfs-ready@raw-files.service
ConditionPathExists=/srv/files/todos/todo.txt

[Service]
Environment="AGENT_COLLECT_SOURCE=--volume /srv/files/todos:/entities:ro"
Environment="AGENT_COLLECT_ARGS=tasks --entities /entities"
# Two small files; the timeout is the net under a frozen podman, not a budget.
TimeoutStartSec=120
