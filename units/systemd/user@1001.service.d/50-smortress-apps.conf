[Unit]
# A lingering user manager starts tenant Quadlets at boot. It must not exist
# until the tenant's uid allocation, egress rule and quotas are in place, so a
# broken prerequisite stops the tenant instead of running it unbounded.
Requires=smortress-apps-user.service smortress-apps-egress.service smortress-apps-quota.service
After=smortress-apps-user.service smortress-apps-egress.service smortress-apps-quota.service
