# One browsing pass: snapshot the live profile, commit the copy, render the view
# on top of the collection stage the template holds.
#
# Three stages rather than three units, for the same reason the calendar pass has
# two: the collector refuses a database that is still being written (a `-wal` or
# `-journal` beside it), and only one process knows how to take a consistent copy
# while the browser holds the file. Stage 1, below as `ExecStartPre=`, is
# `apps/brave_ingest/snapshot.py`: SQLite's backup API against a read-only
# connection, and -- when the live artifact cannot be backed up that way -- a copy
# of `History` with its sidecars into a staging directory whose write-ahead log is
# folded in before anything is committed. Either way the collector is handed one
# file with no sibling.
#
# `quarantine/brave/History` is the published copy, replaced by rename, so a
# collection never reads a half-written one. It is disposable: every pass replaces
# it, and the replica is what keeps history.
#
# `sources/brave` is not: it is the same snapshot as a file an agent's shell can
# read, kept beside the replica rather than inside it (SDLC #995). Nothing but the
# view stage below writes it, and it is replaced whole, so a client that wants to
# know whether it is advancing reads `state.json`'s `last_run` rather than diffing
# the file.
#
# No stage has a network. The provider half is `agent-brave.container`: it holds
# the chain membership and is the only process that talks to Brave's sync server,
# through the allowlist proxy on `agent-brave.network`. This unit reads a local
# file and writes the personal replica, so it needs no address at all -- which is
# why it is not on any of the collectors' networks, and why the template's default
# `--network none` is the whole of it here.
#
# The names it records are constants, not discovery: `--device smortress` is this
# host, the only one whose history is collected, and `--profile default` is the one
# headless profile `agent-brave.container` runs. Chromium's own profile name is
# `Default`; the collector's `profile` is the device-side label the replica is keyed
# by, and a second profile on this host would be a second label, not a second path.
[Unit]
Description=Snapshot and collect Brave browsing history into the personal replica
# Nothing to snapshot before the browser has run once. A path or timer start in
# that window is skipped rather than reported as broken.
ConditionPathExists=/var/lib/agent/local/quarantine/brave-profile/Default/History

[Service]
# Stage 1: the quiesced copy. The profile is read-only in here -- the backup API
# opens the source `mode=ro` so it never creates a sidecar beside the browser's
# file -- and the quarantine directory is the one writable mount. 64m of tmpfs
# because the backup spills a page cache the other stages never need.
ExecStartPre=/usr/bin/podman run --rm --replace --name smortress-agent-brave-snapshot \
  --network none \
  ${AGENT_COLLECT_HARDENING} \
  --tmpfs /tmp:rw,size=64m \
  --volume /var/lib/agent/local/quarantine/brave-profile:/profile:ro \
  --volume /var/lib/agent/local/quarantine/brave:/quarantine:z \
  ${AGENT_COLLECT_ENV} \
  --entrypoint python3 \
  ${AGENT_COLLECT_IMAGE} \
  -m apps.brave_ingest.snapshot --database /profile/Default/History \
  --out /quarantine/History
# Stage 2, the template's collection stage: publish what the snapshot wrote. The
# copy is mounted read-only here, so the collector cannot create the sidecar it
# would then refuse, and the replica is the only writable mount. `deleted` stays 0:
# retention expiry, a user deleting history and a profile being recreated all look
# the same from here, so a vanished table is carried forward with a reason instead
# of being tombstoned.
Environment="AGENT_COLLECT_SOURCE=--volume /var/lib/agent/local/quarantine/brave:/quarantine:ro"
Environment="AGENT_COLLECT_ARGS=brave --database /quarantine/History --device smortress --profile default"
# Stage 3: the plain-file view (SDLC #995). The replica above is the fidelity
# anchor and is readable only through code that knows its layout; this is the same
# snapshot rendered as a file an agent's own shell can read -- `cat`, `rg`, `jq` --
# under `sources/brave`, which the personal gateway mounts. It copies the snapshot
# to `/out/History` rather than moving it, so the collection stage could run again
# over the same input, and it writes `state.json` last, so a pass that fails
# halfway leaves the previous `last_run` saying the view is stale. Bounded on
# purpose: the newest 2000 visits inside 90 days, replaced whole on every pass.
ExecStart=/usr/bin/podman run --rm --replace --name smortress-agent-brave-publish \
  --network none \
  ${AGENT_COLLECT_HARDENING} \
  --tmpfs /tmp:rw,size=16m \
  --volume /var/lib/agent/local/quarantine/brave:/quarantine:ro \
  --volume /var/lib/agent/local/sources/brave:/out:z \
  ${AGENT_COLLECT_ENV} \
  --entrypoint python3 \
  ${AGENT_COLLECT_IMAGE} \
  -m data_plane.collectors.raw.publish_brave --history /quarantine/History --out /out
# A snapshot of a large history and a full table dump: the limit is generous
# because a slow one is still a complete one, and no stage retries.
TimeoutStartSec=600
